$('formProfil').addEventListener('submit', async e => {
  e.preventDefault();
  const nom = $('nomProfil').value.trim();
  const bouton = $('validerProfil');
  bouton.disabled = true;
  try {
    if (formulaire.type === 'ouvrir') {
      const cible = formulaire.id;
      if (!(await codeCorrect(cible, $('codeActuel').value))) throw new Error('Code incorrect.');
      fermerFormulaire();
      await choisirProfil(cible);
    } else if (formulaire.type === 'code') {
      if (formulaire.verrouille && !(await codeCorrect(formulaire.id, $('codeActuel').value))) {
        throw new Error('Code actuel incorrect.');
      }
      const nouveau = $('codeNouveau').value;
      if (nouveau !== $('codeConfirme').value) throw new Error('Les deux codes ne sont pas identiques.');
      let code = null;
      if (nouveau) {
        if (nouveau.length < 4) throw new Error('Le code doit faire au moins 4 caractères.');
        const sel = b64(crypto.getRandomValues(new Uint8Array(16)));
        code = {sel, empreinte: await empreinteCode(nouveau, sel)};
      }
      await api('api/profils/code', {method: 'POST', body: JSON.stringify({id: formulaire.id, code})});
      fermerFormulaire();
      ouvrirProfils();
    } else if (formulaire.type === 'creer') {
      await envoyerProgression();
      const d = await api('api/profils', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nom})});
      fermerFormulaire();
      apresChoix(d.profil);
    } else {
      await api('api/profils/renommer', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: formulaire.id, nom})});
      if (profil && profil.id === formulaire.id) { profil.nom = nom; majProfil(); }
      fermerFormulaire();
      ouvrirProfils();
    }
  } catch (err) {
    $('erreurProfil').textContent = err.message;
  } finally {
    bouton.disabled = false;
  }
});

let enAttente = null, minuterie = null;
function noterProgression(){
  const vue = Math.min(R.index + (R.mode === 'double' ? R.step - 1 : 0), R.total - 1);
  R.livre.progression = {page: vue, total: R.total, maj: Date.now() / 1000};
  enAttente = {id: R.livre.id, page: vue};
  clearTimeout(minuterie);
  minuterie = setTimeout(envoyerProgression, 700);
}
function envoyerProgression(){
  clearTimeout(minuterie);
  if (!enAttente) return Promise.resolve();
  const corps = JSON.stringify(enAttente);
  enAttente = null;
  return api('api/progression', {method: 'POST', body: corps}).catch(() => {});
}

async function ouvrir(l){
  envoyerProgression();
  R.livre = l;
  R.token++;
  R.fin = false;
  $('rTitre').textContent = l.titre;
  $('selMode').value = R.mode;
  $('selFit').value = R.fit;
  $('btnRtl').classList.toggle('on', R.rtl);
  if (!reader.classList.contains('open')) {
    reader.classList.add('open');
    document.body.style.overflow = 'hidden';
    history.replaceState(Object.assign({}, history.state, {scroll: scrollY}), '');
    history.pushState({dossier: dossierCourant, lecture: true}, '');
  }
  scroller.replaceChildren();
  message('Ouverture…');
  const token = R.token;
  try {
    const d = await api('api/livre/' + l.id);
    if (token !== R.token) return;
    R.total = d.pages;
  } catch (e) {
    message(e.message);
    return;
  }
  if (!R.total) { message('Ce fichier ne contient aucune image.'); return; }
  const p = l.progression;
  R.index = p && p.page < R.total - 1 ? p.page : 0;
  $('curseur').max = R.total;
  appliquerMode();
}

function fermer(depuisHistorique){
  if (!reader.classList.contains('open')) return;
  envoyerProgression();
  reader.classList.remove('open');
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  R.token++;
  R.livre = null;
  viderStage();
  scroller.replaceChildren();
  if (!depuisHistorique && history.state && history.state.lecture) {
    fermetureEnCours = true;
    history.back();
  }
  afficher();
}

function majBarre(){
  const fin = R.mode === 'double' && R.step === 2 ? R.index + 2 : R.index + 1;
  $('pageLabel').textContent = (fin > R.index + 1 ? `${R.index + 1}-${fin}` : `${R.index + 1}`) + ' / ' + R.total;
  $('curseur').value = R.index + 1;
}

function appliquerMode(){
  const defil = R.mode === 'scroll';
  stage.style.display = defil ? 'none' : '';
  scroller.classList.toggle('on', defil);
  $('selFit').disabled = defil;
  $('btnRtl').disabled = defil;
  stage.className = 'fit-' + R.fit + (R.mode === 'double' ? ' double' : '') + (R.rtl ? ' rtl' : '');
  $('curseur').style.direction = R.rtl && !defil ? 'rtl' : 'ltr';
  if (defil) construireDefilement();
  else { scroller.replaceChildren(); afficherPage(R.index); }
}

function chargerImage(i){
  const id = R.livre.id;
  return new Promise(res => {
    const im = new Image();
    im.alt = `Page ${i + 1}`;
    im.decoding = 'async';
    im.onload = im.onerror = () => res(im);
    urlPage(id, i).then(u => { im.src = u; }).catch(() => res(im));
  });
}

function precharger(i){
  if (i < 0 || i >= R.total) return;
  urlPage(R.livre.id, i).catch(() => {});
}

async function afficherPage(i){
  i = Math.max(0, Math.min(R.total - 1, i));
  R.index = i;
  R.fin = false;
  const token = ++R.token;
  const indices = [i];
  if (R.mode === 'double' && i > 0 && i + 1 < R.total) indices.push(i + 1);
  const imgs = await Promise.all(indices.map(chargerImage));
  if (token !== R.token) return;
  if (!imgs[0].naturalWidth) { message("Impossible d'afficher cette page."); majBarre(); return; }

  // Une planche déjà en format paysage s'affiche seule
  if (imgs.length === 2 && (imgs[0].naturalWidth > imgs[0].naturalHeight || imgs[1].naturalWidth > imgs[1].naturalHeight)) {
    imgs.length = 1;
  }
  R.step = imgs.length;
  viderStage();
  stage.append(...imgs);
  stage.scrollTop = 0;
  stage.scrollLeft = R.rtl ? stage.scrollWidth : 0;
  majBarre();
  noterProgression();
  for (let k = 1; k <= 4; k++) precharger(i + R.step - 1 + k);
  precharger(i - 1);
}

function livreSuivant(){
  const serie = livres.filter(x => x.serie === R.livre.serie).sort((a, b) => collator.compare(a.titre, b.titre));
  return serie[serie.findIndex(x => x.id === R.livre.id) + 1];
}
function blocFin(){
  const d = document.createElement('div');
  d.className = 'fin';
  const h = document.createElement('h3');
  h.textContent = 'Fin de ' + R.livre.titre;
  d.append(h);
  const suivant = livreSuivant();
  if (suivant) {
    const p = document.createElement('p'); p.textContent = 'Suivant dans la série : ' + suivant.titre;
    const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = 'Lire la suite';
    b.onclick = e => { e.stopPropagation(); ouvrir(suivant); };
    d.append(p, b);
  }
  const r = document.createElement('button'); r.className = 'btn'; r.textContent = 'Retour à la bibliothèque';
  r.onclick = e => { e.stopPropagation(); fermer(); };
  d.append(r);
  return d;
}
function afficherFin(){
  R.token++;
  R.fin = true;
  R.index = R.total - 1;
  R.step = 1;
  noterProgression();
  viderStage();
  stage.append(blocFin());
}

function suivante(){
  if (R.mode === 'scroll') return defiler(1);
  if (R.fin) return;
  const n = R.mode === 'double' ? (R.index === 0 ? 1 : R.index + R.step) : R.index + 1;
  if (n < R.total) afficherPage(n); else afficherFin();
}
function precedente(){
  if (R.mode === 'scroll') return defiler(-1);
  if (R.fin) return afficherPage(R.total - 1);
  if (R.index === 0) return;
  afficherPage(R.mode === 'double' ? (R.index <= 1 ? 0 : R.index - 2) : R.index - 1);
}
function tourner(cote){ ((cote === 'right') !== R.rtl) ? suivante() : precedente(); }

/* Défilement vertical (webtoon) */
let obsChargement = null, obsPosition = null;
function construireDefilement(){
  obsChargement?.disconnect();
  obsPosition?.disconnect();
  scroller.replaceChildren();
  const token = R.token;
  obsChargement = new IntersectionObserver(entrees => {
    for (const en of entrees) {
      if (!en.isIntersecting) continue;
      obsChargement.unobserve(en.target);
      const im = new Image();
      im.alt = `Page ${+en.target.dataset.i + 1}`;
      im.onload = () => { if (token === R.token) en.target.classList.add('loaded'); };
      urlPage(R.livre.id, +en.target.dataset.i).then(u => { if (token === R.token) im.src = u; }).catch(() => {});
      en.target.append(im);
    }
  }, {root: scroller, rootMargin: '2000px 0px'});
  obsPosition = new IntersectionObserver(entrees => {
    for (const en of entrees) {
      if (en.isIntersecting) { R.index = +en.target.dataset.i; majBarre(); noterProgression(); }
    }
  }, {root: scroller, rootMargin: '-45% 0px -45% 0px'});
  const frag = document.createDocumentFragment();
  for (let i = 0; i < R.total; i++) {
    const d = document.createElement('div');
    d.className = 'pg'; d.dataset.i = i;
    frag.append(d);
  }
  frag.append(blocFin());
  scroller.append(frag);
  scroller.querySelectorAll('.pg').forEach(d => { obsChargement.observe(d); obsPosition.observe(d); });
  allerDefilement(R.index);
  majBarre();
}
function defiler(sens){ scroller.scrollBy({top: sens * scroller.clientHeight * 0.85, behavior: 'smooth'}); }
function allerDefilement(i){ scroller.children[i]?.scrollIntoView(); }

stage.addEventListener('click', () => reader.classList.toggle('hide-ui'));

function pleinEcran(){
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

/* Glisser le doigt pour tourner les pages */
let toucher = null;
stage.addEventListener('touchstart', e => {
  const zoom = window.visualViewport && visualViewport.scale > 1.01;
  toucher = (e.touches.length === 1 && !zoom)
    ? {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()} : null;
}, {passive: true});
stage.addEventListener('touchend', e => {
  if (!toucher) return;
  const t = e.changedTouches[0], t0 = toucher;
  toucher = null;
  const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0.t > 800) return;
  if (stage.scrollWidth > stage.clientWidth + 2) return;   // image plus large que l'écran : on laisse défiler
  tourner(dx < 0 ? 'right' : 'left');
}, {passive: true});

addEventListener('keydown', e => {
  if (!reader.classList.contains('open') || !$('panneauIA').hidden) return;
  if ((e.target.tagName === 'SELECT' || e.target.type === 'range') && e.key !== 'Escape') return;
  const defil = R.mode === 'scroll';
  switch (e.key) {
    case 'ArrowRight': case 'd': tourner('right'); break;
    case 'ArrowLeft': case 'q': case 'a': tourner('left'); break;
    case ' ': case 'PageDown': suivante(); break;
    case 'PageUp': precedente(); break;
    case 'Home': defil ? allerDefilement(0) : afficherPage(0); break;
    case 'End': defil ? allerDefilement(R.total - 1) : afficherPage(R.total - 1); break;
    case 'f': case 'F': pleinEcran(); break;
    case 'h': case 'H': reader.classList.toggle('hide-ui'); break;
    case 'Escape': if (!document.fullscreenElement) fermer(); return;
    default: return;
  }
  e.preventDefault();
});

/* ================= Assistant IA (via le relais Cloudflare) ================= */
const IA = {messages: [], sujet: null, enCours: false, restants: null, statutVerifie: false};
const iaActive = () => !!CONFIG.RELAIS_IA;
const adresseRelais = chemin => CONFIG.RELAIS_IA.replace(/\/+$/, '') + chemin;
const ecranTactile = matchMedia('(pointer: coarse)').matches;

async function appelRelais(chemin, corps){
  if (!(await jetonPret())) {
    sessionExpiree();
    throw new Error('Session Google expirée : touchez « Reconnecter » en haut, puis réessayez.');
  }
  let r;
  try {
    r = await fetch(adresseRelais(chemin), {
      method: corps ? 'POST' : 'GET',
      headers: Object.assign({Authorization: 'Bearer ' + G.jeton}, corps ? {'Content-Type': 'application/json'} : {}),
      body: corps ? JSON.stringify(corps) : undefined,
    });
  } catch {
    throw new Error("Le relais de l'assistant ne répond pas. Vérifiez la connexion Internet et l'adresse RELAIS_IA.");
  }
  const d = await r.json().catch(() => ({}));
  if (typeof d.restants === 'number') IA.restants = d.restants;
  if (!r.ok) throw new Error(d.erreur || `Erreur du relais (${r.status}).`);
  return d;
}

/* ----- Résumé des lectures envoyé à l'IA ----- */
function oeuvresPourIA(){

function etatOeuvre(g){
  const n = g.livres.length;
  const lus = g.livres.filter(termine).length;
  const enCoursL = g.livres.filter(enCours).sort((a, b) => b.progression.maj - a.progression.maj)[0];
  if (lus === n) return n > 1 ? 'terminée' : 'lu';
  const parts = [];
  if (enCoursL) {
    const p = enCoursL.progression;
    parts.push(`en cours : « ${enCoursL.titre} » page ${p.page + 1}/${p.total}` + (p.masque ? ' (retiré de la reprise, peut-être abandonné)' : ''));
  }
  if (lus) parts.push(`${lus}/${n} tomes lus`);
  return parts.join(', ') || 'pas commencée';
}

function contexteLecture(){
  const l = [];
  l.push(`Lecteur : ${profil ? profil.nom : 'inconnu'}. Date : ${new Date().toLocaleDateString('fr-FR')}.`);
  if (IA.sujet) {
    const s = IA.sujet;
    l.push(`LECTURE AFFICHÉE À L'ÉCRAN : « ${s.livre.titre} » (série : ${s.livre.serie}), page ${s.page + 1} sur ${s.total}. Ne rien révéler au-delà de cette page.`);
  }
  l.push(`Bibliothèque « ${document.title} » : ${texteCompte(livres, true)}.`);
  const recents = livres.filter(x => x.progression && x.progression.page > 0)
    .sort((a, b) => b.progression.maj - a.progression.maj).slice(0, 8);
  if (recents.length) {
    l.push('', 'Lectures les plus récentes :');
    for (const x of recents) {
      l.push(`- ${x.serie} / ${x.titre} : ${termine(x) ? 'terminé' : `page ${x.progression.page + 1}/${x.progression.total}`}`);
    }
  }
  l.push('', 'Œuvres de la bibliothèque (chemin du dossier — nombre de tomes — état ; ♥ = favori) :');
  for (const g of oeuvresPourIA()) {
    l.push(`- ${g.nom} — ${g.livres.length} tome${g.livres.length > 1 ? 's' : ''} — ${etatOeuvre(g)}${g.favori ? ' ♥' : ''}`);
  }
  const texte = l.join('\n');
  return texte.length > 29000 ? texte.slice(0, 29000) + '\n[liste tronquée]' : texte;
}

/* ----- Image de la page affichée (pour « Explique cette page ») ----- */
async function imagePage(id, i){
  const source = await (await fetch(await urlPage(id, i))).blob();
  const bmp = await createImageBitmap(source);
  const echelle = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * echelle);
  c.height = Math.round(bmp.height * echelle);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close();
  const jpeg = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  const donnees = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = rej;
    fr.readAsDataURL(jpeg);
  });
  return {image: {mime: 'image/jpeg', donnees}, apercu: URL.createObjectURL(jpeg)};
}

/* ----- Affichage des réponses (mise en forme simple et sûre) ----- */
function texteRiche(el, texte){
  const enLigne = (parent, s) => {
    for (const m of s.split(/(\*\*[^*]+\*\*)/g)) {
      if (!m) continue;
      if (/^\*\*[^*]+\*\*$/.test(m)) {
        const b = document.createElement('strong');
        b.textContent = m.slice(2, -2);
        parent.append(b);
      } else {
        parent.append(document.createTextNode(m.replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,;:!?])/g, '$1$2')));
      }
    }
  };
  let liste = null, para = null;
  for (const brute of String(texte).replace(/\r/g, '').split('\n')) {
    const ligne = brute.trim();
    if (!ligne) { liste = null; para = null; continue; }
    const puce = ligne.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (puce) {
      if (!liste) { liste = document.createElement('ul'); el.append(liste); }
      para = null;
      const li = document.createElement('li');
      enLigne(li, puce[1]);
      liste.append(li);
      continue;
    }
    liste = null;
    const titre = ligne.match(/^#{1,6}\s+(.*)$/);
    if (titre) {
      const p = document.createElement('p');
      const b = document.createElement('strong');
      b.textContent = titre[1];
      p.append(b);
      el.append(p);
      para = null;
      continue;
    }
    if (!para) { para = document.createElement('p'); el.append(para); }
    else para.append(document.createElement('br'));
    enLigne(para, ligne);
  }
}

function dessinerFilIA(){
  const fil = $('iaFil');
  fil.replaceChildren();
  const bulle = (classe, remplir) => {
    const b = document.createElement('div');
    b.className = 'bulle ' + classe;
    remplir(b);
    fil.append(b);
    return b;
  };
  if (!IA.messages.length) {
    bulle('ia', b => texteRiche(b, IA.sujet
      ? `Bonjour ${profil ? profil.nom : ''} ! Je sais que vous lisez **${IA.sujet.livre.titre}**, page ${IA.sujet.page + 1}. Posez-moi une question : je ne dévoilerai rien de la suite.`
      : `Bonjour ${profil ? profil.nom : ''} ! Je connais votre bibliothèque et vos lectures. Je peux vous proposer quoi lire, vous rappeler une histoire sans spoiler, ou répondre à vos questions sur une série.`));
  }
  for (const m of IA.messages) {
    if (m.role === 'user') {
      bulle('moi' + (m.echec ? ' echec' : ''), b => {
        if (m.apercu) {
          const img = document.createElement('img');
          img.src = m.apercu;
          img.alt = 'Page envoyée';
          b.append(img);
        }
        b.append(document.createTextNode(m.texte));
      });
    } else if (m.role === 'model') {
      bulle('ia', b => texteRiche(b, m.texte));
    } else {
      bulle('erreur', b => { b.textContent = m.texte; });
    }
  }
  if (IA.enCours) bulle('ia attente', b => { b.textContent = "L'assistant réfléchit…"; });
  $('iaSuggestions').hidden = IA.messages.some(m => m.role !== 'erreur');
  $('iaEnvoyer').disabled = IA.enCours;
  fil.scrollTop = fil.scrollHeight;
}

function dessinerSuggestionsIA(){
  const zone = $('iaSuggestions');
  zone.replaceChildren();
  const idees = IA.sujet
    ? [['Explique cette page', true], ["Résume l'histoire jusqu'ici, sans spoiler", false],
       ['Qui sont les personnages principaux ?', false], ['Que lire après cette série ?', false]]
    : [['Que lire ensuite ?', false], ['Un manga proche de mes favoris', false],
       ['Où en suis-je dans mes lectures ?', false], ['Une lecture courte pour ce soir', false]];
  for (const [texte, avecImage] of idees) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = (avecImage ? '🖼 ' : '') + texte;
    b.addEventListener('click', () => envoyerIA(texte, avecImage));
    zone.append(b);
  }
}

function majInfoIA(){
  const morceaux = [];
  if (typeof IA.restants === 'number') morceaux.push(`${IA.restants} message${IA.restants > 1 ? 's' : ''} restant${IA.restants > 1 ? 's' : ''} aujourd'hui`);
  morceaux.push("L'IA (Gemini) voit vos titres et votre progression, et peut se tromper.");
  $('iaInfo').textContent = morceaux.join(' · ');
}

async function envoyerIA(texte, avecImage){
  texte = String(texte || '').trim();
  if (!texte || IA.enCours) return;
  const message = {role: 'user', texte};
  IA.messages.push(message);
  IA.enCours = true;
  $('iaTexte').value = '';
  ajusterSaisieIA();
  dessinerFilIA();
  let image = null;
  try {
    if (avecImage && IA.sujet) {
      const r = await imagePage(IA.sujet.livre.id, IA.sujet.page);
      image = r.image;
      message.apercu = r.apercu;
      dessinerFilIA();
    }
    const aEnvoyer = IA.messages.filter(m => (m.role === 'user' && !m.echec) || m.role === 'model')
      .map(m => ({role: m.role, texte: m.texte}));
    const d = await appelRelais('/discuter', {messages: aEnvoyer, contexte: contexteLecture(), image});
    IA.messages.push({role: 'model', texte: d.texte});
  } catch (e) {
    message.echec = true;
    IA.messages.push({role: 'erreur', texte: e.message});
  } finally {
    IA.enCours = false;
    dessinerFilIA();
    majInfoIA();
  }
}

function ouvrirIA(depuisLecture){
  if (!iaActive()) return;
  const sujet = depuisLecture && R.livre ? {livre: R.livre, page: R.index, total: R.total} : null;
  const memeSujet = (IA.sujet && IA.sujet.livre.id) === (sujet && sujet.livre.id);
  if (!memeSujet) IA.messages = [];   // nouveau livre ou retour à la bibliothèque : nouvelle conversation
  IA.sujet = sujet;
  $('iaSujet').textContent = sujet
    ? `${sujet.livre.titre}, page ${sujet.page + 1}/${sujet.total}`
    : `Profil : ${profil ? profil.nom : ''}`;
  dessinerSuggestionsIA();
  dessinerFilIA();
  majInfoIA();
  const panneau = $('panneauIA');
  if (panneau.hidden) {
    panneau.hidden = false;
    document.body.style.overflow = 'hidden';
    history.pushState(Object.assign({}, history.state, {ia: true}), '');
  }
  if (!ecranTactile) $('iaTexte').focus();
  if (!IA.statutVerifie) {
    IA.statutVerifie = true;
    appelRelais('/statut').then(majInfoIA).catch(e => {
      IA.statutVerifie = false;
      IA.messages.push({role: 'erreur', texte: e.message});
      dessinerFilIA();
    });
  }
}

function fermerIA(depuisHistorique){
  const panneau = $('panneauIA');
  if (panneau.hidden) return;
  panneau.hidden = true;
  if (!reader.classList.contains('open')) document.body.style.overflow = '';
  if (!depuisHistorique && history.state && history.state.ia) {
    fermetureEnCours = true;
    history.back();
  }
}

function ajusterSaisieIA(){
  const t = $('iaTexte');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

$('iaForm').addEventListener('submit', e => { e.preventDefault(); envoyerIA($('iaTexte').value, false); });
$('iaTexte').addEventListener('input', ajusterSaisieIA);
$('iaTexte').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !ecranTactile) { e.preventDefault(); envoyerIA($('iaTexte').value, false); }
});
$('iaNouvelle').addEventListener('click', () => { IA.messages = []; dessinerFilIA(); });
$('iaFermer').addEventListener('click', () => fermerIA(false));
$('btnIA').addEventListener('click', () => ouvrirIA(false));
$('btnIALecture').addEventListener('click', e => { e.stopPropagation(); ouvrirIA(true); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('panneauIA').hidden) fermerIA(false); });
$('btnIALecture').hidden = !iaActive();

demarrer();   // connexion Google, puis bibliothèque
</script>
