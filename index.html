<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2233">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Bibliothèque</title>
<style>
:root{
  --ink:#1a2233;
  --ink-2:#232d42;
  --ink-3:#2f3b55;
  --paper:#efe9dc;
  --muted:#9aa4b8;
  --yellow:#f2c230;
  --cyan:#3fb7c9;
  --display:Bahnschrift,"DIN Alternate","Avenir Next Condensed","Arial Narrow",sans-serif;
  --ui:"Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--ink);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);
  background-size:7px 7px;
  color:var(--paper);font-family:var(--ui);font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Bibliothèque ---------- */
header{
  position:sticky;top:0;z-index:5;background:var(--ink);border-bottom:3px solid var(--yellow);
  padding:12px clamp(14px,3vw,36px);padding-top:max(12px,env(safe-area-inset-top));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0 auto 0 0;line-height:1}
h1 small{font-family:var(--ui);font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink-3);border:0;border-radius:4px;padding:8px 13px;cursor:pointer}
.btn:hover{background:#3a486a}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--yellow);color:var(--ink);font-weight:600}
.btn.primary:hover{background:#ffd34d}
input[type=search],select{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:4px;padding:7px 10px}
input[type=search]{width:220px}
main{padding:22px clamp(14px,3vw,36px) 60px}

h2.rayon{font-family:var(--display);font-size:22px;margin:var(--esp-rayon,36px) 0 14px;padding-bottom:6px;border-bottom:1px solid var(--ink-3)}
h2.rayon:first-child{margin-top:0}
h2.rayon.reprendre{color:var(--yellow);border-bottom-color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.rangee{
  display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:22px;
  overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin;
}

.book{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;width:100%;min-width:0;max-width:100%}
.cover{
  position:relative;aspect-ratio:2/3;width:100%;background:var(--ink-2);border-radius:2px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.06),0 10px 18px -8px rgba(0,0,0,.7);
}
.cover img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.cover .progress,.cover .badge,.compteur{z-index:2}
.cover .ph{position:absolute;inset:0;background:linear-gradient(160deg,var(--ink-2),var(--ink-3))}
.book:hover .cover{outline:3px solid var(--yellow)}
.progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.55)}
.progress i{display:block;height:100%;background:var(--cyan)}
.badge{position:absolute;top:6px;right:6px;background:var(--cyan);color:var(--ink);font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px}
.book .t{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bascule{display:flex}
.bascule .btn{border-radius:0}
.bascule .btn:first-child{border-radius:4px 0 0 4px}
.bascule .btn:last-child{border-radius:0 4px 4px 0}
.bascule .btn[aria-pressed=true]{background:var(--cyan);color:var(--ink);font-weight:600}
h2.rayon .nb{font-family:var(--ui);font-size:13px;font-weight:400;color:var(--muted);margin-left:10px}

.liste{display:flex;flex-direction:column;max-width:920px;border-top:1px solid var(--ink-3)}
.ligne{
  position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;
  padding:12px 6px;background:none;border:0;border-bottom:1px solid var(--ink-3);text-align:left;cursor:pointer;
}
.ligne:hover{background:var(--ink-2)}
.ligne .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .s{grid-column:1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .st{grid-column:2;grid-row:1 / span 2;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ligne .st.lu{color:var(--cyan);font-weight:600}
.ligne .st.cours{color:var(--paper)}
.ligne .barre{position:absolute;left:0;bottom:-1px;height:2px;background:var(--cyan)}

.ligne{padding-left:calc(6px + var(--niv, 0) * 22px)}
.dossier{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:2px 10px;width:100%;
  padding:13px 6px;padding-left:calc(6px + var(--niv, 0) * 22px);
  background:none;border:0;border-bottom:1px solid var(--ink-3);text-align:left;cursor:pointer;position:relative;
}
.dossier:hover{background:var(--ink-2)}
.dossier .chev{grid-row:1 / span 2;font-size:14px;color:var(--yellow);transition:transform .15s}
.dossier[aria-expanded=true] .chev{transform:rotate(90deg)}
.dossier .n{font-family:var(--display);font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dossier .s{grid-column:2;font-size:12px;color:var(--muted)}
.dossier .st{grid-column:3;grid-row:1 / span 2;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dossier .st.lu{color:var(--cyan);font-weight:600}
.dossier .barre{position:absolute;left:0;bottom:-1px;height:2px;background:var(--cyan);opacity:.6}
.sous{display:flex;flex-direction:column;background:rgba(0,0,0,.12)}
.outils-liste{display:flex;gap:8px;margin:0 0 12px}
.outils-liste .btn{padding:5px 11px;font-size:13px}

/* Vue couvertures : dossiers en piles + fil d'Ariane */
.grid{padding-top:8px}
.pile{position:relative}
.pile::before,.pile::after{content:"";position:absolute;inset:0;border-radius:2px;z-index:0}
.pile::before{background:var(--ink-3);transform:translate(8px,-8px)}
.pile::after{background:#3d4b6c;transform:translate(4px,-4px)}
.pile .cover{z-index:1}
.compteur{
  position:absolute;left:6px;bottom:10px;background:var(--yellow);color:var(--ink);
  font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px;
}
.carte-dossier .t{font-family:var(--display);font-size:16px}
.fil{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 4px;font-size:14px}
.fil .btn{padding:5px 11px;margin-right:6px}
.fil .lien{background:none;border:0;padding:4px 2px;color:var(--muted);cursor:pointer}
.fil .lien:hover{color:var(--paper);text-decoration:underline}
.fil .sep{color:var(--muted)}
.fil .ici{font-weight:600}

/* Profils */
.profil-btn{display:flex;align-items:center;gap:8px;background:var(--ink-2);border:0;border-radius:22px;padding:4px 14px 4px 4px;cursor:pointer;font-weight:600}
.profil-btn:hover{background:var(--ink-3)}
.avatar{
  display:grid;place-items:center;flex:none;width:104px;height:104px;border-radius:22px;
  font-family:var(--display);font-weight:700;font-size:54px;color:var(--ink);line-height:1;
}
.avatar.petit{width:32px;height:32px;border-radius:50%;font-size:17px}
#ecranGoogle,#ecranProfils{
  position:fixed;inset:0;z-index:30;overflow-y:auto;
  background-color:var(--ink);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:7px 7px;
  display:flex;flex-direction:column;align-items:center;padding:max(8vh,24px) 20px 40px;
}
#ecranGoogle h2,#ecranProfils h2{font-family:var(--display);font-size:clamp(36px,8vw,56px);margin:0 0 6px;text-align:center}
#ecranGoogle .aide,#ecranProfils .aide{color:var(--muted);margin:0 0 30px;text-align:center}
.tuiles{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;max-width:760px}
.tuile{
  background:none;border:0;padding:6px;border-radius:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;width:128px;text-align:center;
}
.tuile:hover .avatar,.tuile:focus-visible .avatar{outline:3px solid var(--paper);outline-offset:4px}
.tuile:focus-visible{outline:none}
.tuile .nom{font-weight:600;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tuile .info{font-size:12px;color:var(--muted);margin-top:-6px}
.tuile.ajout .avatar{background:none;border:3px dashed var(--ink-3);color:var(--muted);font-family:var(--ui);font-weight:300}
.tuile.ajout:hover .avatar{border-color:var(--yellow);color:var(--yellow);outline:none}
.tuile.actuel .avatar{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--paper)}
.gestion .tuile{cursor:default}
.gestion .tuile:hover .avatar{outline:none}
.gestion .tuile .avatar{opacity:.6}
.actions-tuile{display:flex;flex-direction:column;gap:6px;width:100%}
.actions-tuile .btn{padding:6px 8px;font-size:13px;width:100%}
.actions-tuile .btn.danger:hover{background:#8a3a3a}
.pied-profils{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:34px}
#formProfil{display:flex;flex-direction:column;gap:10px;width:min(340px,100%);margin-top:30px}
#formProfil label{font-weight:600}
#formProfil input{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:4px;padding:11px 12px;font-size:18px}
#formProfil .ligne-btn{display:flex;gap:8px}
#formProfil .ligne-btn .btn{flex:1;padding:10px}
.erreur{color:#ef8f86;margin:0;min-height:1.2em;font-size:14px}

/* Retirer de « Reprendre la lecture » */
.rayon.reprendre{display:flex;align-items:baseline;gap:10px}
.rayon .vider{margin-left:auto;font-family:var(--ui);font-size:13px;font-weight:400;padding:4px 11px}
.reprise-item{position:relative;min-width:0;max-width:100%;scroll-snap-align:start}
.retirer{
  position:absolute;top:6px;right:6px;z-index:3;width:30px;height:30px;padding:0;
  display:grid;place-items:center;border-radius:50%;border:2px solid rgba(0,0,0,.35);
  background:rgba(26,34,51,.88);color:var(--paper);font-size:13px;cursor:pointer;
}
.retirer:hover{background:#8a3a3a}
.liste .reprise-item{display:flex;align-items:stretch;border-bottom:1px solid var(--ink-3)}
.liste .reprise-item .ligne{flex:1;min-width:0;border-bottom:0}
.liste .reprise-item .retirer{
  position:static;flex:none;width:46px;height:auto;border:0;border-radius:0;background:none;color:var(--muted);font-size:15px;
}
.liste .reprise-item .retirer:hover{background:var(--ink-2);color:#ef8f86}
#toast{
  position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:25;
  margin:0 auto;width:fit-content;max-width:calc(100% - 24px);
  display:flex;align-items:center;gap:14px;
  background:var(--paper);color:var(--ink);padding:10px 10px 10px 16px;border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:14px;
}
#toast .btn{background:var(--ink);color:var(--paper);font-weight:600;flex:none}

/* Connexion Google */
#ecranGoogle{z-index:35;justify-content:center}
#ecranGoogle .aide{max-width:440px}
.btn.grand{font-size:17px;padding:13px 22px}
#formDossier{display:flex;flex-direction:column;gap:10px;width:min(460px,100%)}
#formDossier label{font-weight:600}
#formDossier input{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:4px;padding:11px 12px;font-size:16px}
.aide-champ{color:var(--muted);font-size:13px;margin:0}
#bandeauSession{
  position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:center;align-items:center;gap:14px;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--paper);color:var(--ink);font-weight:600;
}

/* Version et mise à jour */
.version{color:var(--muted);font-size:12px;text-align:center;margin:0;opacity:.85}
footer.version{padding:10px 20px 28px}
#ecranGoogle .version,#ecranProfils .version{margin-top:26px}
#bandeauMaj{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;align-items:center;gap:14px;
  padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--cyan);color:var(--ink);font-weight:600;
}
#bandeauMaj .btn{background:var(--ink);color:var(--paper)}

/* Favoris */
:root{--coeur:#ff5a6e}
.carte-wrap{position:relative;min-width:0;max-width:100%}
.coeur{
  position:absolute;top:6px;left:6px;z-index:3;width:32px;height:32px;padding:0;
  display:grid;place-items:center;border:0;border-radius:50%;
  background:rgba(26,34,51,.72);color:var(--paper);cursor:pointer;
}
.coeur svg{width:18px;height:18px;display:block}
.coeur path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.coeur:hover{background:rgba(26,34,51,.95)}
.coeur.actif{color:var(--coeur);background:rgba(26,34,51,.9)}
.coeur.actif path{fill:currentColor}
.coeur.pulse svg{animation:pulse .3s ease-out}
@keyframes pulse{50%{transform:scale(1.35)}}
.ligne-coeur{display:flex;align-items:stretch;border-bottom:1px solid var(--ink-3);min-width:0}
.ligne-coeur > .ligne,.ligne-coeur > .dossier{flex:1;min-width:0;border-bottom:0}
.ligne-coeur .coeur{position:static;flex:none;width:46px;height:auto;border-radius:0;background:none;color:var(--muted)}
.ligne-coeur .coeur:hover{background:var(--ink-2)}
.ligne-coeur .coeur.actif{color:var(--coeur);background:none}
h2.rayon.favoris{color:var(--coeur);border-bottom-color:var(--coeur)}
#zoneFavoris h2.rayon{margin-top:var(--esp-rayon,36px)}
#etageres > #zoneFavoris:first-child h2.rayon{margin-top:0}
.dossier.simple{grid-template-columns:1fr auto}
.dossier.simple .s{grid-column:1}
.dossier.simple .st{grid-column:2}
@media (prefers-reduced-motion:reduce){.coeur.pulse svg{animation:none}}

/* Rangées repliables */
h2.rayon{display:flex;align-items:baseline;gap:10px}
h2.rayon .plier{
  display:inline-flex;align-items:baseline;gap:9px;min-width:0;padding:2px 0;
  background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left;
}
h2.rayon .plier .chev{
  display:inline-block;font-size:.55em;opacity:.8;transform:rotate(90deg);transition:transform .15s;align-self:center;
}
h2.rayon.replie .plier .chev{transform:none}
h2.rayon .plier .nb{margin-left:0}
h2.rayon.replie{margin-bottom:0;border-bottom-style:dashed}
@media (hover:hover){h2.rayon .plier:hover .titre{text-decoration:underline;text-underline-offset:4px}}
@media (prefers-reduced-motion:reduce){h2.rayon .plier .chev{transition:none}}

/* Raccourcis flottants sous l'en-tête */
.raccourcis{
  position:absolute;left:0;right:0;top:calc(100% + 3px);
  display:flex;gap:8px;padding:8px clamp(14px,3vw,36px);
  pointer-events:none;   /* seules les pastilles captent les appuis */
}
.raccourci{
  pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:17px;border:1px solid currentColor;
  background:rgba(35,45,66,.97);box-shadow:0 4px 12px rgba(0,0,0,.55);
  font-size:13px;font-weight:600;cursor:pointer;
}
/* dans un dossier ou pendant une recherche, les pastilles restent affichées : on leur réserve la place */
body.raccourcis-fixes main{padding-top:calc(22px + 42px)}
.raccourci.reprendre{color:var(--yellow)}
.raccourci.favoris{color:var(--coeur)}
.raccourci .nb{color:var(--paper);font-weight:400;opacity:.8}
.raccourci:hover{background:var(--ink-3)}

/* Assistant IA */
.fab-ia{
  position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:15;
  border:0;border-radius:26px;padding:11px 18px;cursor:pointer;
  background:var(--yellow);color:var(--ink);font-weight:700;font-size:15px;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.fab-ia:hover{background:#ffd34d}
body:has(#bandeauMaj:not([hidden])) .fab-ia{bottom:76px}
body:has(.fab-ia:not([hidden])) footer.version{padding-bottom:88px}
#panneauIA{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  background-color:var(--ink);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:7px 7px;
}
@media (min-width:760px){
  #panneauIA{left:auto;width:430px;border-left:3px solid var(--yellow);box-shadow:-12px 0 30px rgba(0,0,0,.5)}
}
.ia-tete{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--ink);border-bottom:2px solid var(--yellow);
}
.ia-tete h2{font-family:var(--display);font-size:21px;margin:0 auto 0 0}
.ia-tete .btn{padding:6px 11px}
.ia-sujet{flex-basis:100%;margin:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ia-fil{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.bulle{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.bulle.moi{align-self:flex-end;background:var(--cyan);color:var(--ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.bulle.moi.echec{opacity:.55}
.bulle.moi img{display:block;max-width:140px;max-height:200px;border-radius:6px;margin-bottom:6px}
.bulle.ia{align-self:flex-start;background:var(--ink-2);border-bottom-left-radius:4px}
.bulle.ia p{margin:0 0 8px}
.bulle.ia p:last-child,.bulle.ia ul:last-child{margin-bottom:0}
.bulle.ia ul{margin:2px 0 8px;padding-left:20px}
.bulle.ia li{margin-bottom:3px}
.bulle.attente{color:var(--muted);animation:respire 1.4s ease-in-out infinite}
@keyframes respire{50%{opacity:.45}}
.bulle.erreur{align-self:stretch;max-width:none;background:#4a2530;color:#ffd9d9;font-size:14px}
.ia-suggestions{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.ia-suggestions button{
  flex:none;border:1px solid var(--ink-3);background:var(--ink-2);border-radius:16px;
  padding:7px 12px;font-size:13px;cursor:pointer;
}
.ia-suggestions button:hover{border-color:var(--yellow)}
.ia-saisie{display:flex;align-items:flex-end;gap:8px;padding:10px 14px 6px;border-top:1px solid var(--ink-3);background:var(--ink)}
.ia-saisie textarea{
  flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 12px;border-radius:10px;
  background:var(--ink-2);border:1px solid var(--ink-3);font:inherit;font-size:16px;line-height:1.35;
}
.ia-saisie .btn{padding:10px 14px}
.ia-info{margin:0;padding:0 14px max(8px,env(safe-area-inset-bottom));background:var(--ink);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bulle.attente{animation:none}}

/* Photo et code des profils */
.avatar.photo{background-size:cover !important;background-position:center !important;background-repeat:no-repeat;color:transparent}
.tuile{position:relative}
.cadenas{
  position:absolute;top:2px;right:6px;width:26px;height:26px;display:grid;place-items:center;
  border-radius:50%;background:var(--ink-2);border:2px solid var(--ink);font-size:13px;
}
#formProfil .champ-code{display:flex;flex-direction:column;gap:6px}
#formProfil .indice{color:var(--muted);font-size:13px;margin:0}

/* Résultats de recherche */
.resultat{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--ink-3)}
.resultat-couv{width:130px;flex:none}
.resultat-tomes{flex:1;min-width:0}

<script>
const $ = id => document.getElementById(id);
const collator = new Intl.Collator('fr', {numeric: true, sensitivity: 'base'});
const appareil = matchMedia('(pointer: coarse)').matches ? 'mobile' : 'ordinateur';

let livres = [];
let vue = 'grille';
let sectionsRepliees = new Set();   // 'reprendre', 'favoris', 'tous'

// Transforme le titre d'une rangée en bouton qui la replie ou la déplie
function enTeteRepliable(h, id, elements){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'plier';
  const chev = document.createElement('span');
  chev.className = 'chev';
  chev.setAttribute('aria-hidden', 'true');
  chev.textContent = '▶';
  b.append(chev);
  for (const n of [...h.childNodes]) {
    if (n.nodeType === Node.TEXT_NODE) {
      const t = document.createElement('span');
      t.className = 'titre';
      t.textContent = n.textContent;
      n.remove();
      b.append(t);
    } else if (n.classList && n.classList.contains('nb')) {
      b.append(n);
    }
  }
  h.prepend(b);
  const appliquer = () => {
    const replie = sectionsRepliees.has(id);
    h.classList.toggle('replie', replie);
    b.setAttribute('aria-expanded', String(!replie));
    b.title = replie ? 'Déplier' : 'Replier';
    elements.forEach(e => { if (e) e.hidden = replie; });
    h.querySelectorAll('.vider').forEach(v => { v.hidden = replie; });
  };
  b.addEventListener('click', () => {
    if (sectionsRepliees.has(id)) sectionsRepliees.delete(id); else sectionsRepliees.add(id);
    appliquer();
    sauverPreferences();
  });
  appliquer();
}
const ouverts = new Set();   // dossiers dépliés dans la vue liste
let dossierCourant = '';     // dossier affiché dans la vue couvertures
let fermetureEnCours = false;
let prefsChargees = false;
const R = {livre: null, total: 0, index: 0, step: 1, mode: 'single', fit: 'height', rtl: false, token: 0, fin: false};

/* ======================================================================
   VERSION : augmentée à chaque mise à jour du fichier
   ====================================================================== */
const VERSION = {numero: 13, date: '2026-09-17'};

function texteVersion(v){
  const [a, m, j] = v.date.split('-');
  return `Version n°${v.numero} du ${j}/${m}/${a}`;
}
document.querySelectorAll('.version').forEach(e => { e.textContent = texteVersion(VERSION); });

// Compare avec le fichier publié sur GitHub (en contournant le cache)
async function verifierMiseAJour(){
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch(location.pathname + '?maj=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const m = (await r.text()).match(/const VERSION = \{numero: (\d+)/);
    if (m && Number(m[1]) > VERSION.numero) document.getElementById('bandeauMaj').hidden = false;
  } catch {}
}
document.getElementById('btnMaj').addEventListener('click', async () => {
  try { await toutEnregistrer(); } catch {}
  location.reload();
});
verifierMiseAJour();
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierMiseAJour(); });

/* ======================================================================
   CONFIGURATION : à remplir une seule fois (voir GUIDE.md)
   ====================================================================== */
const CONFIG = {
  // Identifiant client OAuth créé dans Google Cloud (se termine par .apps.googleusercontent.com)
  CLIENT_ID: '439532508115-1tkkvcl0ak1ol1543ik103hmiju6v2ro.apps.googleusercontent.com',
  // Facultatif : lien du dossier Drive qui contient les mangas.
  // Laissé vide, il est demandé à la première connexion puis mémorisé dans le compte Google.
  DOSSIER: '',
  // Facultatif : adresse du relais de l'assistant IA (voir relais-ia/GUIDE-RELAIS.md).
  // Laissée vide, le bouton de l'assistant n'apparaît pas.
  RELAIS_IA: 'https://bibliotheque-ia.01-kevin-y.workers.dev',
};

/* ======================================================================
   Accès Google Drive (remplace le serveur Python)
   ====================================================================== */
const PORTEES = ['https://www.googleapis.com/auth/drive.readonly', 'https://www.googleapis.com/auth/drive.appdata'];
const DOSSIER_MIME = 'application/vnd.google-apps.folder';
const API_DRIVE = 'https://www.googleapis.com/drive/v3/';
const API_ENVOI = 'https://www.googleapis.com/upload/drive/v3/files';
const FICHIER_DONNEES = 'bibliotheque-donnees.json';
const COULEURS = ['#f2c230', '#3fb7c9', '#ef7a85', '#8fd16a', '#b79cff', '#ff9f43', '#5ea8ff', '#e6e1d3'];
const IMG_RE = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;
const MIME_IMG = {jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', avif: 'image/avif', bmp: 'image/bmp'};
const pause = ms => new Promise(r => setTimeout(r, ms));
const maintenant = () => Math.floor(Date.now() / 1000);

const G = {jeton: null, expire: 0, client: null, surJeton: null, surErreur: null, enCours: null};
const D = {
  racine: '', nomRacine: 'Bibliothèque',
  livres: new Map(),        // id Drive -> livre
  index: new Map(),         // id -> Promise<liste des pages>
  couvertures: new Map(),   // id -> Promise<url>
  couvSauvees: Promise.resolve(new Map()),
  donnees: null, fichierDonnees: null, profilActuel: null,
};

/* ---------- Connexion ---------- */
function chargerScriptGoogle(){
  return new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = res;
    s.onerror = () => rej(new Error('Impossible de joindre Google. Vérifiez la connexion Internet.'));
    document.head.append(s);
  });
}

function initialiserClient(){
  G.client = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: PORTEES.join(' '),
    callback: r => G.surJeton && G.surJeton(r),
    error_callback: e => G.surErreur && G.surErreur(e),
  });
}

function demanderJeton(){
  if (G.enCours) return G.enCours;
  G.enCours = new Promise((res, rej) => {
    G.surJeton = r => {
      if (r.error) return rej(new Error(r.error_description || 'Connexion refusée.'));
      if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...PORTEES)) {
        return rej(new Error("Il faut cocher toutes les autorisations demandées (lecture de Drive et données de l'application)."));
      }
      G.jeton = r.access_token;
      G.expire = Date.now() + (Number(r.expires_in) - 60) * 1000;
      $('bandeauSession').hidden = true;
      res();
    };
    G.surErreur = e => rej(new Error(
      e.type === 'popup_closed' ? 'La fenêtre de connexion a été fermée.' :
      e.type === 'popup_failed_to_open' ? 'Le navigateur a bloqué la fenêtre de connexion : autorisez les fenêtres pop-up pour ce site.' :
      'Connexion à Google impossible.'));
    G.client.requestAccessToken({prompt: ''});
  }).finally(() => { G.enCours = null; });
  return G.enCours;
}

const jetonValide = () => G.jeton && Date.now() < G.expire;

// Si un renouvellement de session est en cours (lancé par l'appui), on l'attend
async function jetonPret(){
  if (!jetonValide() && G.enCours) {
    try { await G.enCours; } catch {}
  }
  return jetonValide();
}

function sessionExpiree(){
  if (!D.donnees) return;   // pas encore connecté : l'écran de connexion s'en charge
  $('bandeauSession').hidden = false;
}

// La session Google dure une heure : on la renouvelle discrètement au prochain appui
document.addEventListener('click', () => {
  if (G.client && D.donnees && G.jeton && Date.now() > G.expire - 5 * 60 * 1000 && !G.enCours) {
    demanderJeton().catch(() => sessionExpiree());
  }
}, true);

/* ---------- Appels à l'API Drive ---------- */
async function drive(chemin, o = {}){
  const url = new URL(chemin.startsWith('https://') ? chemin : API_DRIVE + chemin);
  for (const [k, v] of Object.entries(o.params || {})) {
    if (v !== undefined && v !== null) url.searchParams.set(k, v);
  }
  for (let essai = 0; ; essai++) {
    if (!(await jetonPret())) {
      sessionExpiree();
      throw new Error('Session Google expirée : touchez « Reconnecter ».');
    }
    const r = await fetch(url, {
      method: o.method || 'GET',
      body: o.body,
      keepalive: !!o.keepalive,
      headers: Object.assign({Authorization: 'Bearer ' + G.jeton}, o.headers || {}),
    });
    if (r.ok) {
      if (o.brut) return r;
      return r.status === 204 ? null : r.json();
    }
    if (r.status === 401) {
      G.expire = 0;
      sessionExpiree();
      throw new Error('Session Google expirée : touchez « Reconnecter ».');
    }
    const texte = await r.text();
    const surcharge = r.status === 429 || r.status >= 500 || (r.status === 403 && /rate ?limit/i.test(texte));
    if (surcharge && essai < 4) { await pause(700 * 2 ** essai); continue; }
    if (r.status === 404) throw new Error('Introuvable sur Google Drive (supprimé, ou pas partagé avec ce compte).');
    let message = 'Erreur Google Drive ' + r.status;
    try { message = JSON.parse(texte).error.message || message; } catch {}
    throw new Error(message);
  }
}

async function televerser(nom, blob, mime){
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({name: nom, parents: ['appDataFolder'], mimeType: mime})], {type: 'application/json'}));
  form.append('file', blob, nom);
  return drive(API_ENVOI, {method: 'POST', params: {uploadType: 'multipart', fields: 'id'}, body: form});
}

/* ---------- Lecture des CBZ par morceaux ---------- */
class FichierDrive {
  constructor(id, taille){ this.id = id; this.size = taille; }
  async lire(debut, fin){
    debut = Math.max(0, debut);
    fin = Math.min(this.size, fin);
    if (fin <= debut) return new ArrayBuffer(0);
    const r = await drive('files/' + this.id, {
      params: {alt: 'media', supportsAllDrives: true},
      headers: {Range: `bytes=${debut}-${fin - 1}`},
      brut: true,
    });
    const buf = await r.arrayBuffer();
    return r.status === 206 ? buf : buf.slice(debut, fin);
  }
}

async function indexZip(f){
  const longueur = Math.min(f.size, 65557);
  const fin = new DataView(await f.lire(f.size - longueur, f.size));
  let eocd = -1;
  for (let i = longueur - 22; i >= 0; i--) {
    if (fin.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Ce fichier n'est pas un vrai CBZ.");
  let tailleCD = fin.getUint32(eocd + 12, true);
  let debutCD = fin.getUint32(eocd + 16, true);
  if (debutCD === 0xFFFFFFFF || tailleCD === 0xFFFFFFFF) {
    const loc = eocd - 20;
    if (loc >= 0 && fin.getUint32(loc, true) === 0x07064b50) {
      const pos = Number(fin.getBigUint64(loc + 8, true));
      const z = new DataView(await f.lire(pos, pos + 56));
      if (z.getUint32(0, true) === 0x06064b50) {
        tailleCD = Number(z.getBigUint64(40, true));
        debutCD = Number(z.getBigUint64(48, true));
      }
    }
  }
  const cd = new DataView(await f.lire(debutCD, debutCD + tailleCD));
  const dec = new TextDecoder();
  const entrees = [];
  let p = 0;
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const methode = cd.getUint16(p + 10, true);
    let ctaille = cd.getUint32(p + 20, true);
    let utaille = cd.getUint32(p + 24, true);
    const nlen = cd.getUint16(p + 28, true), elen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    let off = cd.getUint32(p + 42, true);
    const nom = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
    let e = p + 46 + nlen;
    const eFin = e + elen;
    while (e + 4 <= eFin) {
      const id = cd.getUint16(e, true), len = cd.getUint16(e + 2, true);
      if (id === 1) {
        let q = e + 4;
        if (utaille === 0xFFFFFFFF) { utaille = Number(cd.getBigUint64(q, true)); q += 8; }
        if (ctaille === 0xFFFFFFFF) { ctaille = Number(cd.getBigUint64(q, true)); q += 8; }
        if (off === 0xFFFFFFFF) { off = Number(cd.getBigUint64(q, true)); q += 8; }
      }
      e += 4 + len;
    }
    entrees.push({nom, methode, ctaille, off, nlen, elen});
    p += 46 + nlen + elen + clen;
  }
  return entrees;
}

async function extraire(f, en){
  // en-tête local + données en une seule requête (avec un peu de marge)
  let buf = await f.lire(en.off, en.off + 30 + en.nlen + en.elen + 256 + en.ctaille);
  const h = new DataView(buf);
  if (buf.byteLength < 30 || h.getUint32(0, true) !== 0x04034b50) throw new Error('Archive abîmée.');
  const debut = 30 + h.getUint16(26, true) + h.getUint16(28, true);
  if (debut + en.ctaille > buf.byteLength) {
    const reste = await f.lire(en.off + buf.byteLength, en.off + debut + en.ctaille);
    const tout = new Uint8Array(buf.byteLength + reste.byteLength);
    tout.set(new Uint8Array(buf), 0);
    tout.set(new Uint8Array(reste), buf.byteLength);
    buf = tout.buffer;
  }
  const donnees = buf.slice(debut, debut + en.ctaille);
  const type = MIME_IMG[en.nom.split('.').pop().toLowerCase()] || 'application/octet-stream';
  if (en.methode === 0) return new Blob([donnees], {type});
  if (en.methode === 8) {
    const flux = new Blob([donnees]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Blob([await new Response(flux).blob()], {type});
  }
  throw new Error('Compression non prise en charge (' + en.methode + ').');
}

function pagesDe(id){
  if (!D.index.has(id)) {
    const l = D.livres.get(id);
    if (!l) return Promise.reject(new Error('Livre introuvable (déplacé ou supprimé ?).'));
    const p = indexZip(new FichierDrive(l.id, l.taille)).then(entrees => entrees
      .filter(e => IMG_RE.test(e.nom) && !/(^|\/)(__MACOSX|\.)/.test(e.nom))
      .sort((a, b) => collator.compare(a.nom, b.nom)));
    p.catch(() => D.index.delete(id));
    D.index.set(id, p);
  }
  return D.index.get(id);
}

const cachePages = new Map();
function urlPage(id, i){
  const cle = id + ':' + i;
  let p = cachePages.get(cle);
  if (p) {                      // remet en fin de file (le plus récent)
    cachePages.delete(cle);
    cachePages.set(cle, p);
    return p;
  }
  p = pagesDe(id).then(pages => {
    if (!pages[i]) throw new Error('Page introuvable.');
    const l = D.livres.get(id);
    return extraire(new FichierDrive(l.id, l.taille), pages[i]);
  }).then(b => URL.createObjectURL(b));
  p.catch(() => cachePages.delete(cle));
  cachePages.set(cle, p);
  while (cachePages.size > 30) {
    const [k, ancien] = cachePages.entries().next().value;
    cachePages.delete(k);
    ancien.then(u => setTimeout(() => URL.revokeObjectURL(u), 30000)).catch(() => {});
  }
  return p;
}

/* ---------- Couvertures (mémorisées dans l'espace privé de l'application) ---------- */
async function listerCouverturesSauvees(){
  const m = new Map();
  let pageToken;
  do {
    const r = await drive('files', {params: {
      spaces: 'appDataFolder', q: "name contains 'couv-'",
      fields: 'nextPageToken, files(id,name)', pageSize: 1000, pageToken,
    }});
    for (const f of r.files) {
      const x = f.name.match(/^couv-(.+)-(\d+)\.jpg$/);
      if (x) m.set(x[1], {fichier: f.id, mtime: Number(x[2])});
    }
    pageToken = r.nextPageToken;
  } while (pageToken);
  return m;
}

const fileTaches = [];
let tachesActives = 0;
function enFile(tache){
  return new Promise((res, rej) => { fileTaches.push({tache, res, rej}); pomper(); });
}
function pomper(){
  while (tachesActives < 4 && fileTaches.length) {
    const {tache, res, rej} = fileTaches.shift();
    tachesActives++;
    tache().then(res, rej).finally(() => { tachesActives--; pomper(); });
  }
}

async function reduire(blob){
  try {
    const bmp = await createImageBitmap(blob);
    const w = 320, h = Math.round(bmp.height * w / bmp.width);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close();
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8)) || blob;
  } catch { return blob; }
}

async function produireCouverture(id){
  const l = D.livres.get(id);
  const sauvees = await D.couvSauvees;
  const sauvee = sauvees.get(id);
  if (sauvee && sauvee.mtime === l.mtime) {
    try {
      const r = await drive('files/' + sauvee.fichier, {params: {alt: 'media'}, brut: true});
      return URL.createObjectURL(await r.blob());
    } catch {}
  }
  const pages = await pagesDe(id);
  if (!pages.length) throw new Error('Aucune image.');
  const vignette = await reduire(await extraire(new FichierDrive(l.id, l.taille), pages[0]));
  televerser(`couv-${id}-${l.mtime}.jpg`, vignette, 'image/jpeg').then(r => {
    if (sauvee) drive('files/' + sauvee.fichier, {method: 'DELETE', brut: true}).catch(() => {});
    sauvees.set(id, {fichier: r.id, mtime: l.mtime});
  }).catch(() => {});
  return URL.createObjectURL(vignette);
}

function urlCouverture(id){
  if (!D.couvertures.has(id)) {
    const p = enFile(() => produireCouverture(id));
    p.catch(() => D.couvertures.delete(id));
    D.couvertures.set(id, p);
  }
  return D.couvertures.get(id);
}

const obsCouvertures = new IntersectionObserver(entrees => {
  for (const en of entrees) {
    if (!en.isIntersecting) continue;
    obsCouvertures.unobserve(en.target);
    const img = en.target;
    urlCouverture(img.dataset.livre).then(u => { img.src = u; }).catch(() => img.remove());
  }
}, {rootMargin: '400px'});

function afficherCouverture(img, id){
  img.removeAttribute('loading');
  img.dataset.livre = id;
  obsCouvertures.observe(img);
}

/* ---------- Parcours du dossier Drive ---------- */
function idDossier(texte){
  texte = (texte || '').trim();
  const m = texte.match(/folders\/([\w-]{10,})/) || texte.match(/[?&]id=([\w-]{10,})/) || texte.match(/^([\w-]{10,})$/);
  return m ? m[1] : '';
}

async function listerBibliotheque(){
  const racine = await drive('files/' + D.racine, {params: {fields: 'id,name,mimeType', supportsAllDrives: true}});
  if (racine.mimeType !== DOSSIER_MIME) throw new Error("Ce lien ne correspond pas à un dossier Google Drive.");
  D.nomRacine = racine.name;
  const dossiers = new Map([[racine.id, '']]);
  const nouveaux = new Map();
  let niveau = [racine.id];
  while (niveau.length) {
    const suivant = [];
    for (let k = 0; k < niveau.length; k += 30) {
      const paquet = niveau.slice(k, k + 30);
      const q = '(' + paquet.map(id => `'${id}' in parents`).join(' or ') + ') and trashed = false';
      let pageToken;
      do {
        const r = await drive('files', {params: {
          q, pageSize: 1000, pageToken,
          fields: 'nextPageToken, files(id,name,mimeType,size,modifiedTime,parents)',
          supportsAllDrives: true, includeItemsFromAllDrives: true,
        }});
        for (const f of r.files) {
          const parent = (f.parents || []).find(id => paquet.includes(id));
          if (parent === undefined) continue;
          const cheminParent = dossiers.get(parent);
          const nom = f.name.replace(/\//g, '-');
          if (f.mimeType === DOSSIER_MIME) {
            if (!dossiers.has(f.id)) {
              dossiers.set(f.id, cheminParent ? cheminParent + '/' + nom : nom);
              suivant.push(f.id);
            }
          } else if (/\.(cbz|zip)$/i.test(f.name) && Number(f.size) > 0) {
            nouveaux.set(f.id, {
              id: f.id,
              titre: f.name.replace(/\.(cbz|zip)$/i, '').replace(/_+/g, ' ').trim(),
              dossier: cheminParent,
              serie: cheminParent ? cheminParent.replace(/\//g, ' / ') : racine.name,
              mtime: Math.floor(Date.parse(f.modifiedTime) / 1000),
              taille: Number(f.size),
            });
          }
        }
        pageToken = r.nextPageToken;
      } while (pageToken);
    }
    niveau = suivant;
  }
  // Oublie les index des fichiers modifiés depuis le dernier passage
  for (const [id, l] of nouveaux) {
    const ancien = D.livres.get(id);
    if (ancien && ancien.mtime !== l.mtime) { D.index.delete(id); D.couvertures.delete(id); }
  }
  D.livres = nouveaux;
  D.idsDossiers = new Map([...dossiers].map(([id, chemin]) => [chemin, id]));
}

/* ---------- Profils et progression (fichier privé dans le Drive) ---------- */
function normaliser(d){
  d = d && typeof d === 'object' ? d : {};
  return {version: 1, racine: d.racine || '', dernier: d.dernier || '', profils: d.profils || {}, supprimes: d.supprimes || {}};
}

async function chargerDonnees(){
  const r = await drive('files', {params: {spaces: 'appDataFolder', q: `name = '${FICHIER_DONNEES}'`, fields: 'files(id)', pageSize: 10}});
  if (r.files.length) {
    D.fichierDonnees = r.files[0].id;
    D.donnees = normaliser(await drive('files/' + D.fichierDonnees, {params: {alt: 'media'}}));
  } else {
    D.donnees = normaliser({});
  }
}

const horodatage = e => Math.max(e.maj || 0, e.majMasque || 0);
function fusionner(local, distant){
  for (const [pid, t] of Object.entries(distant.supprimes)) local.supprimes[pid] = Math.max(local.supprimes[pid] || 0, t);
  for (const pid of Object.keys(local.supprimes)) { delete local.profils[pid]; delete distant.profils[pid]; }
  for (const [pid, pd] of Object.entries(distant.profils)) {
    const pl = local.profils[pid];
    if (!pl) { local.profils[pid] = pd; continue; }
    if ((pd.majNom || 0) > (pl.majNom || 0)) { pl.nom = pd.nom; pl.majNom = pd.majNom; }
    if ((pd.majCode || 0) > (pl.majCode || 0)) { pl.code = pd.code; pl.majCode = pd.majCode; }
    if ((pd.majImage || 0) > (pl.majImage || 0)) { pl.image = pd.image; pl.majImage = pd.majImage; }
    for (const [id, e] of Object.entries(pd.livres || {})) {
      if (!pl.livres[id] || horodatage(e) > horodatage(pl.livres[id])) pl.livres[id] = e;
    }
    for (const [app, pr] of Object.entries(pd.preferences || {})) {
      if (!pl.preferences[app] || (pr.maj || 0) > (pl.preferences[app].maj || 0)) pl.preferences[app] = pr;
    }
    pl.favoris = pl.favoris || {};
    for (const [cle, f] of Object.entries(pd.favoris || {})) {
      if (!pl.favoris[cle] || (f.maj || 0) > (pl.favoris[cle].maj || 0)) pl.favoris[cle] = f;
    }
  }
  if (!local.racine) local.racine = distant.racine;
}

let donneesModifiees = false, minuterieSauvegarde = null, fileSauvegarde = Promise.resolve();
function marquerModifie(){
  donneesModifiees = true;
  clearTimeout(minuterieSauvegarde);
  minuterieSauvegarde = setTimeout(() => sauvegarder(false), 2500);
}
function sauvegarder(urgent){
  clearTimeout(minuterieSauvegarde);
  fileSauvegarde = fileSauvegarde.then(() => ecrireDonnees(urgent)).catch(e => {
    donneesModifiees = true;
    console.warn('Sauvegarde impossible :', e.message);
  });
  return fileSauvegarde;
}
async function ecrireDonnees(urgent){
  if (!donneesModifiees || !D.donnees || !jetonValide()) return;
  donneesModifiees = false;
  if (D.fichierDonnees && !urgent) {
    // un autre appareil a peut-être écrit entre-temps : on fusionne
    try { fusionner(D.donnees, normaliser(await drive('files/' + D.fichierDonnees, {params: {alt: 'media'}}))); } catch {}
  }
  const corps = JSON.stringify(D.donnees);
  if (D.fichierDonnees) {
    const options = {method: 'PATCH', params: {uploadType: 'media'}, body: corps, headers: {'Content-Type': 'application/json'}};
    try {
      await drive(`${API_ENVOI}/${D.fichierDonnees}`, Object.assign({keepalive: urgent && corps.length < 60000}, options));
    } catch (e) {
      if (!urgent) throw e;
      await drive(`${API_ENVOI}/${D.fichierDonnees}`, options);
    }
  } else {
    const r = await televerser(FICHIER_DONNEES, new Blob([corps], {type: 'application/json'}), 'application/json');
    D.fichierDonnees = r.id;
  }
}

function resume(pid){
  const p = D.donnees.profils[pid];
  const entrees = Object.values(p.livres || {});
  return {
    id: pid, nom: p.nom, couleur: p.couleur,
    image: p.image || '', verrouille: !!(p.code && p.code.empreinte),
    lus: entrees.filter(e => e.total && e.page >= e.total - 1).length,
    en_cours: entrees.filter(e => e.page > 0 && e.page < e.total - 1 && !e.masque).length,
  };
}

function validerNom(nom, sauf){
  nom = String(nom || '').split(/\s+/).filter(Boolean).join(' ');
  if (!nom) throw new Error('Indiquez un prénom.');
  if (nom.length > 24) throw new Error('24 caractères maximum.');
  for (const [pid, p] of Object.entries(D.donnees.profils)) {
    if (pid !== sauf && p.nom.toLocaleLowerCase('fr') === nom.toLocaleLowerCase('fr')) {
      throw new Error(`Le profil « ${nom} » existe déjà.`);
    }
  }
  return nom;
}

function selectionnerProfil(pid){
  D.profilActuel = pid || null;
  D.donnees.dernier = pid || '';
  marquerModifie();
  const url = location.pathname + location.search + (pid ? '#profil=' + pid : '');
  history.replaceState(history.state, '', url);
}

/* ---------- Routeur : mêmes réponses que l'ancien serveur ---------- */
async function routeur(url, o){
  const [chemin, requete = ''] = url.split('?');
  const methode = o.method || 'GET';
  const corps = o.body ? JSON.parse(o.body) : {};
  const profils = D.donnees.profils;
  let m;

  if (chemin === 'api/profils' && methode === 'GET') {
    return {profils: Object.keys(profils).map(resume), actuel: D.profilActuel};
  }
  if (chemin === 'api/livres') {
    if (requete.includes('actualiser') || !D.livres.size) await listerBibliotheque();
    const pid = D.profilActuel;
    const p = pid && profils[pid];
    return {
      nom: D.nomRacine, local: false,
      profil: p ? resume(pid) : null,
      preferences: p ? p.preferences : {},
      dossiers: Object.fromEntries(D.idsDossiers || []),
      favoris: p ? Object.fromEntries(Object.entries(p.favoris || {}).filter(([, f]) => f.actif).map(([cle, f]) => [cle, f.ajout || f.maj])) : {},
      livres: [...D.livres.values()].map(l => Object.assign({}, l, {
        progression: p && p.livres[l.id] ? Object.assign({}, p.livres[l.id]) : null,
      })),
    };
  }
  if ((m = chemin.match(/^api\/livre\/(.+)$/))) {
    return {id: m[1], pages: (await pagesDe(m[1])).length};
  }
  if (chemin === 'api/profils' && methode === 'POST') {
    const nom = validerNom(corps.nom);
    if (Object.keys(profils).length >= 20) throw new Error('20 profils maximum.');
    const pid = Array.from(crypto.getRandomValues(new Uint8Array(4)), b => b.toString(16).padStart(2, '0')).join('');
    const utilisees = new Set(Object.values(profils).map(p => p.couleur));
    const couleur = COULEURS.find(c => !utilisees.has(c)) || COULEURS[Object.keys(profils).length % COULEURS.length];
    profils[pid] = {nom, couleur, majNom: maintenant(), livres: {}, preferences: {}};
    selectionnerProfil(pid);
    return {profil: resume(pid)};
  }
  if (chemin === 'api/profils/renommer') {
    if (!profils[corps.id]) throw new Error('Profil introuvable.');
    profils[corps.id].nom = validerNom(corps.nom, corps.id);
    profils[corps.id].majNom = maintenant();
    marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/profils/code') {
    const cible = profils[corps.id];
    if (!cible) throw new Error('Profil introuvable.');
    if (corps.code) cible.code = {sel: String(corps.code.sel), empreinte: String(corps.code.empreinte)};
    else delete cible.code;
    cible.majCode = maintenant();
    marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/profils/image') {
    const cible = profils[corps.id];
    if (!cible) throw new Error('Profil introuvable.');
    const ancienne = cible.image;
    cible.image = corps.fichier ? String(corps.fichier) : '';
    cible.majImage = maintenant();
    marquerModifie();
    return {ok: true, ancienne};
  }
  if (chemin === 'api/profils/supprimer') {
    delete profils[corps.id];
    D.donnees.supprimes[corps.id] = maintenant();
    if (D.profilActuel === corps.id) selectionnerProfil(null); else marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/profil') {
    if (corps.id && !profils[corps.id]) throw new Error('Profil introuvable.');
    selectionnerProfil(corps.id);
    return {profil: corps.id ? resume(corps.id) : null};
  }

  const p = D.profilActuel && profils[D.profilActuel];
  if (!p) throw Object.assign(new Error('Choisissez un profil.'), {code: 409});

  if (chemin === 'api/progression') {
    if (!D.livres.has(corps.id)) return {ok: false};
    const total = (await pagesDe(corps.id)).length;
    p.livres[corps.id] = {page: Math.max(0, Math.min(corps.page, total - 1)), total, maj: maintenant()};
    marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/preferences') {
    p.preferences[corps.appareil === 'mobile' ? 'mobile' : 'ordinateur'] = {
      mode: ['single', 'double', 'scroll'].includes(corps.mode) ? corps.mode : 'single',
      fit: ['height', 'width', 'original'].includes(corps.fit) ? corps.fit : 'height',
      rtl: !!corps.rtl,
      vue: corps.vue === 'liste' ? 'liste' : 'grille',
      replies: (Array.isArray(corps.replies) ? corps.replies : []).filter(x => ['reprendre', 'favoris', 'tous'].includes(x)),
      maj: maintenant(),
    };
    marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/favori') {
    if (!/^[ld]:[\w-]+$/.test(corps.cle || '')) throw new Error('Favori invalide.');
    p.favoris = p.favoris || {};
    const ancien = p.favoris[corps.cle];
    p.favoris[corps.cle] = {
      actif: !!corps.actif, maj: Date.now(),
      ajout: corps.actif ? (Number(corps.ajout) || Date.now()) : (ancien && ancien.ajout) || 0,
    };
    marquerModifie();
    return {ok: true};
  }
  if (chemin === 'api/reprise') {
    for (const id of corps.ids || []) {
      const e = p.livres[id];
      if (!e) continue;
      if (corps.masquer) e.masque = true; else delete e.masque;
      e.majMasque = maintenant();
    }
    marquerModifie();
    return {ok: true};
  }
  throw new Error('Action inconnue : ' + chemin);
}

async function api(url, options){
  try {
    return await routeur(url, options || {});
  } catch (e) {
    if (e.code === 409) { profil = null; majProfil(); ouvrirProfils(); }
    throw e;
  }
}

async function ouvrirRacine(id){
  const ancien = D.racine;

  try {

  } catch (e) {

    D.couvertures.clear();
    dossierCourant = '';

    history.replaceState({dossier: ''}, '', location.pathname + location.search + location.hash);

async function demarrer(){
  if (CONFIG.CLIENT_ID.startsWith('COLLEZ')) {
    return montrerConnexion("Page pas encore configurée : collez votre identifiant client Google dans CONFIG, tout en haut du script (voir GUIDE.md).", false);
  }

    return montrerConnexion("Google refuse la connexion depuis un fichier ouvert en double-clic. Publiez la page sur GitHub Pages, ou ouvrez-la via http://localhost (voir GUIDE.md).", false);
  }

  montrerConnexion('Chargement…', false);

function etat(titre, texte){
  const d = document.createElement('div');
  d.className = 'etat';
  if (titre) { const h = document.createElement('h2'); h.textContent = titre; d.append(h); }

}

async function charger(actualiser){
  const btn = $('btnActualiser');
  btn.disabled = true;
  try {
    const d = await api('api/livres' + (actualiser ? '?actualiser=1' : ''));
    if (!d.profil) { profil = null; majProfil(); ouvrirProfils(); return; }
    profil = d.profil;
    majProfil();
    livres = d.livres;
    calculerOeuvres();
    favoris = new Map(Object.entries(d.favoris || {}));
    idsDossiers = new Map(Object.entries(d.dossiers || {}));
    cheminsDossiers = new Map([...idsDossiers].map(([c, id]) => [id, c]));
    $('titre').firstChild.textContent = d.nom;
    document.title = d.nom;
    if (!prefsChargees) {

      if (p) {

        vue = p.vue === 'liste' ? 'liste' : 'grille';
        sectionsRepliees = new Set(p.replies || []);
      }
      majBascule();
      prefsChargees = true;
    }
    afficher();
  } catch (e) {
    etat('Lecture de Google Drive impossible', e.message);
  } finally {
    btn.disabled = false;
  }
}

function enCours(l){
  const p = l.progression;
  return p && p.page > 0 && p.page < p.total - 1;
}
function termine(l){
  const p = l.progression;
  return p && p.total > 0 && p.page >= p.total - 1;
}

function carte(l, avecSerie){
  const b = document.createElement('button');
  b.className = 'book';
  b.innerHTML = `
    <div class="cover">
      <div class="ph"></div>
      <img alt="" loading="lazy">
    </div>
    <div class="t"></div>
    <div class="m"></div>`;
  const img = b.querySelector('img');
  img.onerror = () => img.remove();
  afficherCouverture(img, l.id);
  b.querySelector('.t').textContent = l.titre;

  const p = l.progression;
  let meta = avecSerie ? l.serie : '';
  if (termine(l)) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'Lu';
    b.querySelector('.cover').append(badge);
  } else if (enCours(l)) {
    const bar = document.createElement('div');
    bar.className = 'progress';
    bar.innerHTML = `<i style="width:${Math.round((p.page + 1) / p.total * 100)}%"></i>`;
    b.querySelector('.cover').append(bar);
    if (!avecSerie) meta = `Page ${p.page + 1} sur ${p.total}`;
  }
  b.querySelector('.m').textContent = meta || '\u00a0';

  b.addEventListener('click', () => ouvrir(l));

}

function ligne(l, avecSerie){
  const b = document.createElement('button');
  b.className = 'ligne';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = l.titre;
  const st = document.createElement('span');
  st.className = 'st';
  const p = l.progression;
  if (termine(l)) {
    st.textContent = 'Lu';
    st.classList.add('lu');
  } else if (enCours(l)) {
    st.textContent = `Page ${p.page + 1} / ${p.total}`;
    st.classList.add('cours');

    barre.className = 'barre';
    barre.style.width = Math.round((p.page + 1) / p.total * 100) + '%';

  b.append(t, st);

    s.textContent = l.serie;
    b.append(s);

function rayon(titre, items, options = {}){
  const frag = document.createDocumentFragment();
  const h = document.createElement('h2');
  h.className = 'rayon' + (options.reprendre ? ' reprendre' : '');

/* ----- Nombre d'œuvres -----
   Une œuvre = un dossier qui contient des livres et aucun sous-dossier (une série).
   Un livre posé dans un dossier qui contient aussi des sous-dossiers
   (la racine, ou plus tard un dossier de genre) compte comme une œuvre à lui seul. */
let dossiersAvecSous = new Set();
function calculerOeuvres(){
  dossiersAvecSous = new Set();
  for (const l of livres) {
    const parts = (l.dossier || '').split('/').filter(Boolean);
    for (let i = 0; i < parts.length; i++) dossiersAvecSous.add(parts.slice(0, i).join('/'));
  }
}
function nbOeuvres(liste){
  return new Set(liste.map(l => {
    const d = l.dossier || '';
    return dossiersAvecSous.has(d) ? 'livre:' + l.id : 'dossier:' + d;
  })).size;
}
const pluriel = (n, mot, motPluriel) => `${n} ${n > 1 ? (motPluriel || mot + 's') : mot}`;
function texteCompte(liste, toujoursOeuvres){
  const o = nbOeuvres(liste);
  const livresTxt = pluriel(liste.length, 'livre');
  return (o > 1 || toujoursOeuvres) ? `${pluriel(o, 'œuvre')}, ${livresTxt}` : livresTxt;
}

/* ----- Regroupement par œuvre (série ou livre isolé) ----- */
function groupesOeuvres(){
  const groupes = new Map();
  for (const l of livres) {
    const d = l.dossier || '';
    const isole = dossiersAvecSous.has(d);
    const cle = isole ? 'l:' + l.id : 'd:' + d;
    if (!groupes.has(cle)) {
      groupes.set(cle, {
        cle,
        cleFavori: isole ? 'l:' + l.id : (idsDossiers.get(d) ? 'd:' + idsDossiers.get(d) : null),
        isole,
        dossier: d,
        nom: isole ? (d ? d + '/' : '') + l.titre : d,
        titre: isole ? l.titre : (d.split('/').pop() || d),
        favori: isole ? favoris.has('l:' + l.id) : favoris.has('d:' + idsDossiers.get(d)),
        livres: [],
      });
    }
    groupes.get(cle).livres.push(l);
  }
  const tout = [...groupes.values()];
  for (const g of tout) g.livres.sort((a, b) => collator.compare(a.titre, b.titre));
  return tout.sort((a, b) => collator.compare(a.nom, b.nom));
}

/* ----- Favoris -----
   On met en favori une œuvre : un dossier de série (clé « d:idDrive »)
   ou un livre isolé (clé « l:idDrive »). */
let favoris = new Map();          // clé -> date d'ajout
let idsDossiers = new Map();      // chemin -> id Drive
let cheminsDossiers = new Map();  // id Drive -> chemin
const SVG_COEUR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';

const estSerie = d => d.dossiers.size === 0 && d.livres.length > 0;
const estLivreIsole = l => dossiersAvecSous.has(l.dossier || '');
const cleDossier = d => idsDossiers.has(d.chemin) ? 'd:' + idsDossiers.get(d.chemin) : null;
const cleLivre = l => 'l:' + l.id;

function majCoeur(b){
  const actif = favoris.has(b.dataset.cle);
  b.classList.toggle('actif', actif);
  b.setAttribute('aria-pressed', String(actif));
  b.title = actif ? 'Retirer des favoris' : 'Ajouter aux favoris';
  b.setAttribute('aria-label', (actif ? 'Retirer des favoris : ' : 'Ajouter aux favoris : ') + b.dataset.nom);
}
function boutonCoeur(cle, nom){
  const b = document.createElement('button');
  b.className = 'coeur';
  b.innerHTML = SVG_COEUR;
  b.dataset.cle = cle;
  b.dataset.nom = nom;
  majCoeur(b);
  b.addEventListener('click', e => { e.stopPropagation(); basculerFavori(cle, nom, !favoris.has(cle)); });
  return b;
}
// Enveloppe une carte (vue couvertures) avec son cœur
function avecCoeur(carteEl, cle, nom){
  const w = document.createElement('div');
  w.className = 'carte-wrap';
  w.append(carteEl);
  if (cle) w.append(boutonCoeur(cle, nom));
  return w;
}
// Enveloppe une ligne (vue liste) avec son cœur au bout
function ligneAvecCoeur(ligneEl, cle, nom){
  if (!cle) return ligneEl;
  const w = document.createElement('div');
  w.className = 'ligne-coeur';
  w.append(ligneEl, boutonCoeur(cle, nom));
  return w;
}

async function basculerFavori(cle, nom, actif, dateAjout){
  const avant = favoris.get(cle);
  const ajout = dateAjout || Date.now();
  if (actif) favoris.set(cle, ajout); else favoris.delete(cle);
  document.querySelectorAll('.coeur').forEach(b => {
    if (b.dataset.cle !== cle) return;
    majCoeur(b);
    if (actif) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
  });
  rafraichirFavoris();
  try {
    await api('api/favori', {method: 'POST', body: JSON.stringify({cle, actif, ajout})});
  } catch (e) {
    if (avant) favoris.set(cle, avant); else favoris.delete(cle);
    document.querySelectorAll('.coeur').forEach(b => { if (b.dataset.cle === cle) majCoeur(b); });
    rafraichirFavoris();
    notifier('Impossible de modifier les favoris : ' + e.message);
    return;
  }
  if (!actif) notifier(`« ${nom} » retiré des favoris.`, () => basculerFavori(cle, nom, true, avant));
  else if (!$('toast').hidden && $('toastMsg').textContent.includes('retiré des favoris')) $('toast').hidden = true;
}

// Remplace seulement la rangée des favoris, sans faire sauter la page
function rafraichirFavoris(){
  const ancien = document.getElementById('zoneFavoris');
  planifierRaccourcis();
  if (!ancien) return;
  const haut = ancien.getBoundingClientRect().top;
  const h0 = ancien.offsetHeight;
  const nouveau = zoneFavoris();
  ancien.replaceWith(nouveau);
  if (haut < 0) scrollBy(0, nouveau.offsetHeight - h0);
}

function zoneFavoris(){
  const z = document.createElement('div');
  z.id = 'zoneFavoris';
  const arbre = construireArbre(livres);
  const elements = [...favoris.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([cle]) => elementFavori(cle, arbre))
    .filter(Boolean);
  if (!elements.length) return z;
  const h = document.createElement('h2');
  h.className = 'rayon favoris';
  h.textContent = 'Favoris';
  const nb = document.createElement('span');
  nb.className = 'nb';
  nb.textContent = elements.length;
  h.append(nb);
  const g = document.createElement('div');
  g.className = vue === 'liste' ? 'liste' : 'rangee';
  g.append(...elements);
  z.append(h, g);
  enTeteRepliable(h, 'favoris', [g]);
  return z;
}

function elementFavori(cle, arbre){
  if (cle.startsWith('l:')) {
    const l = livres.find(x => x.id === cle.slice(2));
    if (!l) return null;
    return vue === 'liste'
      ? ligneAvecCoeur(ligne(l, true), cle, l.titre)
      : avecCoeur(carte(l, true), cle, l.titre);
  }
  const chemin = cheminsDossiers.get(cle.slice(2));
  const d = chemin !== undefined && chemin !== '' ? trouverNoeud(arbre, chemin) : null;
  if (!d) return null;
  if (vue !== 'liste') return avecCoeur(carteDossier(d), cle, d.nom);
  // Vue liste : la ligne ouvre le dossier dans l'arborescence plus bas
  const b = ligneDossier(d, 0, false, false, true);
  b.addEventListener('click', () => {
    const parts = d.chemin.split('/');
    parts.forEach((_, i) => ouverts.add(parts.slice(0, i + 1).join('/')));
    if (sectionsRepliees.delete('tous')) sauverPreferences();
    afficher();
    const cible = document.querySelector(`#etageres .liste .dossier:not(.simple)[data-chemin="${CSS.escape(d.chemin)}"]`);
    cible?.scrollIntoView({block: 'start', behavior: 'smooth'});
  });
  return ligneAvecCoeur(b, cle, d.nom);
}

/* ----- Vue liste : arborescence des dossiers ----- */
function construireArbre(liste){
  const racine = {nom: '', chemin: '', dossiers: new Map(), livres: []};
  for (const l of liste) {
    let n = racine;
    for (const part of (l.dossier || '').split('/').filter(Boolean)) {
      if (!n.dossiers.has(part)) {
        n.dossiers.set(part, {nom: part, chemin: n.chemin ? n.chemin + '/' + part : part, dossiers: new Map(), livres: []});
      }
      n = n.dossiers.get(part);
    }
    n.livres.push(l);
  }
  return racine;
}
function tousLesLivres(n){
  return [...n.livres, ...[...n.dossiers.values()].flatMap(tousLesLivres)];
}

function ligneDossier(d, niveau, ouvert, forceOuvert, simple){
  const tous = tousLesLivres(d);
  const lus = tous.filter(termine).length;
  const commences = tous.filter(enCours).length;
  const b = document.createElement('button');
  b.className = 'dossier' + (simple ? ' simple' : '');
  b.style.setProperty('--niv', niveau);
  b.dataset.chemin = d.chemin;
  if (simple) {
    b.innerHTML = '<span class="n"></span><span class="st"></span><span class="s"></span>';
  } else {
    b.setAttribute('aria-expanded', String(ouvert));
    b.innerHTML = '<span class="chev" aria-hidden="true">▶</span><span class="n"></span><span class="st"></span><span class="s"></span>';
  }
  b.querySelector('.n').textContent = d.nom;
  b.querySelector('.s').textContent = texteCompte(tous);
  const st = b.querySelector('.st');
  if (lus === tous.length) { st.textContent = 'Tout lu'; st.classList.add('lu'); }
  else if (lus) st.textContent = `${lus} / ${tous.length} lus`;
  else if (commences) st.textContent = 'En cours';
  if (lus && lus < tous.length) {
    const barre = document.createElement('span');
    barre.className = 'barre';
    barre.style.width = Math.round(lus / tous.length * 100) + '%';
    b.append(barre);
  }
  if (simple) return b;
  b.addEventListener('click', () => {
    if (forceOuvert) return;
    const bloc = b.closest('.ligne-coeur') || b;   // la ligne peut être enveloppée avec son cœur
    const deplie = b.getAttribute('aria-expanded') === 'true';
    if (deplie) {
      ouverts.delete(d.chemin);
      // referme aussi les sous-dossiers
      for (const c of [...ouverts]) if (c.startsWith(d.chemin + '/')) ouverts.delete(c);
      bloc.nextElementSibling?.classList.contains('sous') && bloc.nextElementSibling.remove();
      b.setAttribute('aria-expanded', 'false');
    } else {
      ouverts.add(d.chemin);
      bloc.after(contenuDossier(d, niveau + 1, false));
      b.setAttribute('aria-expanded', 'true');
    }
  });
  return b;
}

function contenuDossier(n, niveau, forceOuvert){
  const bloc = document.createElement('div');
  bloc.className = niveau === 0 ? 'liste' : 'sous';
  const dossiers = [...n.dossiers.values()].sort((a, b) => collator.compare(a.nom, b.nom));
  for (const d of dossiers) {
    const ouvert = forceOuvert || ouverts.has(d.chemin);
    const ligneD = ligneDossier(d, niveau, ouvert, forceOuvert);
    bloc.append(estSerie(d) ? ligneAvecCoeur(ligneD, cleDossier(d), d.nom) : ligneD);
    if (ouvert) bloc.append(contenuDossier(d, niveau + 1, forceOuvert));
  }
  n.livres.sort((a, b) => collator.compare(a.titre, b.titre)).forEach(l => {
    const r = ligne(l, false);
    r.style.setProperty('--niv', niveau + (niveau ? 0.9 : 0));
    bloc.append(estLivreIsole(l) ? ligneAvecCoeur(r, cleLivre(l), l.titre) : r);
  });
  return bloc;
}

function vueListe(zone, liste, recherche){
  const h = document.createElement('h2');
  h.className = 'rayon';
  h.textContent = recherche ? 'Résultats' : 'Tous les livres';
  zone.append(h);
  const arbre = construireArbre(liste);
  let outils = null;
  if (!recherche && arbre.dossiers.size) {
    outils = document.createElement('div');
    outils.className = 'outils-liste';
    const tout = document.createElement('button');
    tout.className = 'btn'; tout.textContent = 'Tout déplier';
    tout.onclick = () => {
      const ajouter = n => n.dossiers.forEach(d => { ouverts.add(d.chemin); ajouter(d); });
      ajouter(arbre);
      afficher();
    };
    const rien = document.createElement('button');
    rien.className = 'btn'; rien.textContent = 'Tout replier';
    rien.onclick = () => { ouverts.clear(); afficher(); };
    outils.append(tout, rien);
    zone.append(outils);
  }
  // Pendant une recherche, tous les dossiers contenant un résultat sont dépliés
  const arbo = contenuDossier(arbre, 0, !!recherche);
  zone.append(arbo);
  if (!recherche) {
    const nb = document.createElement('span');
    nb.className = 'nb';
    nb.textContent = texteCompte(liste, true);
    h.append(nb);
    enTeteRepliable(h, 'tous', [outils, arbo]);
  }
}

/* ----- Vue couvertures : navigation dans les dossiers ----- */
function trouverNoeud(arbre, chemin){
  let n = arbre;
  for (const part of chemin.split('/').filter(Boolean)) {
    n = n.dossiers.get(part);
    if (!n) return null;
  }
  return n;
}
function premierLivre(n){
  const l = [...n.livres].sort((a, b) => collator.compare(a.titre, b.titre))[0];
  if (l) return l;
  const d = [...n.dossiers.values()].sort((a, b) => collator.compare(a.nom, b.nom))[0];
  return d ? premierLivre(d) : null;
}

function allerDossier(chemin, remplacer){
  const parent = chemin.split('/').slice(0, -1).join('/');
  history.replaceState(Object.assign({}, history.state, {scroll: scrollY}), '');
  const etatNav = {dossier: chemin, depuisParent: !remplacer && parent === dossierCourant};
  if (remplacer) history.replaceState(etatNav, ''); else history.pushState(etatNav, '');
  dossierCourant = chemin;
  afficher();
  scrollTo(0, 0);
}

function carteDossier(d){
  const tous = tousLesLivres(d);
  const lus = tous.filter(termine).length;
  const commences = tous.filter(enCours).length;
  const premier = premierLivre(d);
  const b = document.createElement('button');
  b.className = 'book carte-dossier';
  b.innerHTML = `
    <div class="pile"><div class="cover">
      <div class="ph"></div>
      <img alt="" loading="lazy">
      <span class="compteur"></span>
    </div></div>
    <div class="t"></div>
    <div class="m"></div>`;
  const img = b.querySelector('img');
  img.onerror = () => img.remove();
  if (premier) afficherCouverture(img, premier.id); else img.remove();
  b.querySelector('.compteur').textContent = tous.length;
  const cover = b.querySelector('.cover');
  if (lus === tous.length) {
    const badge = document.createElement('span');
    badge.className = 'badge'; badge.textContent = 'Lu';
    cover.append(badge);
  } else if (lus) {
    const bar = document.createElement('div');
    bar.className = 'progress';
    bar.innerHTML = `<i style="width:${Math.round(lus / tous.length * 100)}%"></i>`;
    cover.append(bar);
  }
  b.querySelector('.t').textContent = d.nom;
  let meta = texteCompte(tous);
  if (lus && lus < tous.length) meta += `, ${lus} lu${lus > 1 ? 's' : ''}`;
  else if (!lus && commences) meta += ', en cours';
  b.querySelector('.m').textContent = meta;
  b.title = 'Ouvrir le dossier ' + d.nom;
  b.addEventListener('click', () => allerDossier(d.chemin));
  return b;
}

function filAriane(racineNom){
  const nav = document.createElement('nav');
  nav.className = 'fil';
  nav.setAttribute('aria-label', 'Emplacement');
  const parties = dossierCourant.split('/');
  const parent = parties.slice(0, -1).join('/');

  const retour = document.createElement('button');
  retour.className = 'btn';
  retour.textContent = '‹ Retour';
  retour.onclick = () => {
    if (history.state && history.state.dossier === dossierCourant && history.state.depuisParent) history.back();
    else allerDossier(parent, true);
  };
  nav.append(retour);

  const lien = (texte, chemin) => {
    const b = document.createElement('button');
    b.className = 'lien'; b.textContent = texte;
    b.onclick = () => allerDossier(chemin);
    return b;
  };
  const sep = () => { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; return s; };
  nav.append(lien(racineNom, ''));
  parties.forEach((p, i) => {
    nav.append(sep());
    if (i === parties.length - 1) {
      const ici = document.createElement('span');
      ici.className = 'ici'; ici.textContent = p;
      nav.append(ici);
    } else {
      nav.append(lien(p, parties.slice(0, i + 1).join('/')));
    }
  });
  return nav;
}

function vueCouvertures(zone, liste){
  const arbre = construireArbre(liste);
  let n = trouverNoeud(arbre, dossierCourant);
  if (!n) {   // dossier supprimé ou renommé entre-temps
    dossierCourant = '';
    history.replaceState({dossier: ''}, '');
    n = arbre;
  }
  const racineNom = document.title || 'Bibliothèque';
  if (dossierCourant) zone.append(filAriane(racineNom));

  const h = document.createElement('h2');
  h.className = 'rayon';
  h.textContent = dossierCourant ? n.nom : 'Tous les livres';
  const nb = document.createElement('span');
  nb.className = 'nb';
  nb.textContent = texteCompte(tousLesLivres(n), !dossierCourant);
  h.append(nb);

  const g = document.createElement('div');
  g.className = 'grid';
  [...n.dossiers.values()]
    .sort((a, b) => collator.compare(a.nom, b.nom))
    .forEach(d => g.append(estSerie(d) ? avecCoeur(carteDossier(d), cleDossier(d), d.nom) : carteDossier(d)));
  [...n.livres]
    .sort((a, b) => collator.compare(a.titre, b.titre))
    .forEach(l => g.append(estLivreIsole(l) ? avecCoeur(carte(l, false), cleLivre(l), l.titre) : carte(l, false)));
  zone.append(h, g);
  if (!dossierCourant) enTeteRepliable(h, 'tous', [g]);
}

function avecRetrait(el, l){

  w.append(el, x);
  return w;

async function masquerReprise(items, masquer = true){
  const appliquer = valeur => items.forEach(l => {
    if (!l.progression) return;
    if (valeur) l.progression.masque = true; else delete l.progression.masque;
  });
  appliquer(masquer);
  afficher();
  try {
    await api('api/reprise', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ids: items.map(l => l.id), masquer})
    });
  } catch (e) {
    appliquer(!masquer);
    afficher();
    notifier("Impossible de modifier la liste : " + e.message);
    return;
  }
  if (masquer) {
    notifier(items.length > 1
      ? `${items.length} livres retirés de la reprise.`
      : `« ${items[0].titre} » retiré de la reprise.`,
      () => masquerReprise(items, false));
  } else {
    $('toast').hidden = true;
  }
}

/* ----- Raccourcis « Reprendre » / « Favoris » ----- */
const livresEnReprise = () => livres.filter(l => enCours(l) && !l.progression.masque);
function nbFavorisValides(){
  let n = 0;
  for (const cle of favoris.keys()) {
    if (cle.startsWith('l:')) {
      if (livres.some(l => l.id === cle.slice(2))) n++;
    } else {
      const c = cheminsDossiers.get(cle.slice(2));
      if (c && livres.some(l => (l.dossier || '') === c || (l.dossier || '').startsWith(c + '/'))) n++;
    }
  }
  return n;
}

function majRaccourcis(){
  const nav = $('raccourcis');
  if (!profil || !livres.length) { nav.hidden = true; document.body.classList.remove('raccourcis-fixes'); return; }
  const basEnTete = document.querySelector('header').getBoundingClientRect().bottom;
  const sectionsAffichees = !$('recherche').value.trim() && (vue === 'liste' || !dossierCourant);
  const titreReprise = document.querySelector('#etageres > h2.rayon.reprendre');
  const blocs = {
    reprendre: [titreReprise, titreReprise && titreReprise.nextElementSibling],
    favoris: [document.getElementById('zoneFavoris')],
  };
  const nombres = {reprendre: Math.min(livresEnReprise().length, 15), favoris: nbFavorisValides()};
  let auMoinsUn = false;
  for (const b of nav.querySelectorAll('.raccourci')) {
    const id = b.dataset.cible;
    const encoreVisible = sectionsAffichees && blocs[id].some(e =>
      e && !e.hidden && e.offsetParent && e.getBoundingClientRect().bottom > basEnTete + 4);
    const montrer = nombres[id] > 0 && !encoreVisible;
    b.hidden = !montrer;
    b.querySelector('.nb').textContent = nombres[id];
    auMoinsUn = auMoinsUn || montrer;
  }
  nav.hidden = !auMoinsUn;
  document.body.classList.toggle('raccourcis-fixes', auMoinsUn && !sectionsAffichees);
}

function afficherContenu(){
  const q = $('recherche').value.trim().toLowerCase();
  $('compte').textContent = livres.length ? ' ' + texteCompte(livres, true) : '';
  const zone = $('etageres');

  if (!livres.length) {
    etat('Aucun livre trouvé', "Ce dossier Drive ne contient pas encore de fichier .cbz. Ajoutez-en puis touchez Actualiser.");
    return;
  }
  const liste = livres
    .filter(l => !q || l.titre.toLowerCase().includes(q) || l.serie.toLowerCase().includes(q))
    .sort((a, b) => collator.compare(a.serie, b.serie) || collator.compare(a.titre, b.titre));
  if (!liste.length) {
    etat('', `Aucun titre ne correspond à « ${q} ».`);
    return;
  }

  zone.replaceChildren();
  if (!q && (vue === 'liste' || !dossierCourant)) {
    const reprise = livres.filter(l => enCours(l) && !l.progression.masque).sort((a, b) => b.progression.maj - a.progression.maj).slice(0, 15);
    if (reprise.length) zone.append(rayon('Reprendre la lecture', reprise, {reprendre: true}));
    zone.append(zoneFavoris());
  }
  if (q) { vueRecherche(zone, q); return; }
  if (vue === 'liste') { vueListe(zone, liste, ''); return; }
  vueCouvertures(zone, liste);
}

/* ----- Résultats de recherche : une œuvre, puis ses tomes ----- */
function vueRecherche(zone, q){
  const resultats = [];
  for (const g of groupesOeuvres()) {
    const nomTrouve = g.nom.toLowerCase().includes(q);
    const tomes = g.livres.filter(l => l.titre.toLowerCase().includes(q));
    if (nomTrouve || tomes.length) resultats.push({groupe: g, livres: nomTrouve ? g.livres : tomes});
  }
  if (!resultats.length) {
    etat('', `Aucune œuvre ne correspond à « ${q} ».`);
    return;
  }

  const total = resultats.reduce((n, r) => n + r.livres.length, 0);
  const h = document.createElement('h2');
  h.className = 'rayon';
  h.textContent = 'Résultats';
  const nb = document.createElement('span');
  nb.className = 'nb';
  nb.textContent = `${pluriel(resultats.length, 'œuvre')}, ${pluriel(total, 'livre')}`;
  h.append(nb);
  zone.append(h);

  const seuls = resultats.filter(r => r.groupe.isole);
  const arbre = construireArbre(livres);
  for (const r of resultats.filter(x => !x.groupe.isole)) {
    zone.append(blocResultat(r, arbre));
  }
  if (seuls.length) {
    const t = document.createElement('h3');
    t.className = 'rayon oeuvre';
    const titre = document.createElement('span');
    titre.className = 'titre-oeuvre';
    titre.textContent = 'Livres seuls';
    t.append(titre);
    zone.append(t);
    const g = document.createElement('div');
    g.className = vue === 'liste' ? 'liste' : 'grid';
    for (const r of seuls) {
      const l = r.livres[0];
      g.append(vue === 'liste'
        ? ligneAvecCoeur(ligne(l, true), cleLivre(l), l.titre)
        : avecCoeur(carte(l, true), cleLivre(l), l.titre));
    }
    zone.append(g);
  }
}

function ouvrirOeuvre(g){
  $('recherche').value = '';
  if (vue === 'liste') {
    const parts = g.dossier.split('/');
    parts.forEach((_, i) => ouverts.add(parts.slice(0, i + 1).join('/')));
    sectionsRepliees.delete('tous');
    afficher();
    document.querySelector(`#etageres .liste .dossier:not(.simple)[data-chemin="${CSS.escape(g.dossier)}"]`)
      ?.scrollIntoView({block: 'start'});
  } else {
    allerDossier(g.dossier);
  }
}

// Un résultat : la pile de couvertures avec son cœur à gauche, les tomes à droite
function blocResultat(r, arbre){
  const g = r.groupe;
  const bloc = document.createElement('div');
  bloc.className = 'resultat';

  const noeud = trouverNoeud(arbre, g.dossier);
  const colonne = document.createElement('div');
  colonne.className = 'resultat-couv';
  if (noeud) {
    const pile = avecCoeur(carteDossier(noeud), g.cleFavori, g.titre);
    // le clic ouvre l'œuvre, même en vue liste (sauf sur le cœur)
    pile.addEventListener('click', e => {
      if (e.target.closest('.coeur')) return;
      e.stopPropagation();
      ouvrirOeuvre(g);
    }, true);
    colonne.append(pile);
  }
  bloc.append(colonne);

  const droite = document.createElement('div');
  droite.className = 'resultat-tomes';
  const details = [];
  if (g.nom !== g.titre) details.push(g.nom.replace(/\//g, ' / '));
  if (r.livres.length < g.livres.length) details.push(`${r.livres.length} sur ${g.livres.length} tomes`);
  if (details.length) {
    const info = document.createElement('p');
    info.className = 'tomes-info';
    info.textContent = details.join(' · ');
    droite.append(info);
  }
  const liste = document.createElement('div');
  liste.className = 'liste';
  for (const l of r.livres) liste.append(ligne(l, false));
  droite.append(liste);
  bloc.append(droite);
  return bloc;
}

/* ----- Code d'accès d'un profil ----- */
const codeDe = pid => (D.donnees.profils[pid] || {}).code || null;
const b64 = octets => btoa(String.fromCharCode(...new Uint8Array(octets)));
const depuisB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));

async function empreinteCode(code, sel){
  const cle = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    {name: 'PBKDF2', salt: depuisB64(sel), iterations: 120000, hash: 'SHA-256'}, cle, 256);
  return b64(bits);
}
async function codeCorrect(pid, code){
  const c = codeDe(pid);
  if (!c) return true;
  try { return (await empreinteCode(code, c.sel)) === c.empreinte; } catch { return false; }
}

/* ----- Photo de profil ----- */
async function vignetteProfil(fichier){
  const bmp = await createImageBitmap(fichier);
  const cote = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  c.getContext('2d').drawImage(bmp, (bmp.width - cote) / 2, (bmp.height - cote) / 2, cote, cote, 0, 0, 256, 256);
  bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

async function changerImageProfil(pid, fichier){
  try {
    $('aideProfils').textContent = 'Envoi de la photo…';
    const vignette = await vignetteProfil(fichier);

    const d = await api('api/profils/image', {method: 'POST', body: JSON.stringify({id: pid, fichier: envoi.id})});
    if (d.ancienne) {
      imagesProfil.delete(d.ancienne);

}

async function synchroniserProfils(silencieux){

  if (!silencieux) { btn.disabled = true; btn.textContent = 'Actualisation…'; }
  try {
    await sauvegarder(false);   // on envoie d'abord nos propres changements

      else { profil = resume(profil.id); majProfil(); charger(false); }

    btn.disabled = false;

  $('nomProfil').value = nomVisible && f.type === 'renommer' ? f.nom : '';
  $('codeActuel').value = $('codeNouveau').value = $('codeConfirme').value = '';
  $('erreurProfil').textContent = '';
